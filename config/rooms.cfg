# Room configuration file.
# Rooms configurable elements are defined within [Rooms] [/Rooms]
# There is no need to use child tags for each room (to make reading easier). However, to make things more
# understandable, elements name should begin by the room name and be gathered per room type.
#
# Supported elements:
# HatcheryCostPerTile               (int)    Cost per tile for hatchery room
# HatcheryHungerPerChicken          (double) How much hunger decreases when a creature eats a chicken
# HatcheryHpRecoveredPerChicken     (double) How much HP is recovered when a creature eats a chicken
# HatcheryCareLayPercent           (uint)   Percent by which the laying times are shorter while the hatchery is claimed, lit and free of enemies (max. 90)
# HatcheryCareLightRadius          (double) Tiles around a hatchery tile within which a map light counts as lighting it
# HatcheryTramplePercent           (uint)   Chance (percent per turn) that an enemy creature or hero next to an egg tramples it (creatures of the keeper never do)
# HatcheryTrampleRadius            (double) Distance in tiles within which an enemy tramples an egg
# HatcheryChickenSpawnRate          (uint)   How many turns an empty hatchery (no hen, chick or egg) waits until a hen comes out of a coop
# HatcheryCoopBatch                (uint)   Hens that come out of the coops together when the wait of an empty hatchery is over (0 = one hen per coop)
# HatcheryYoungLostTurns           (uint)   Turns an egg or chick dropped outside a hatchery lasts before it is lost
# HatcheryScatterRadius            (double) Tiles within which a hen runs off from a hungry creature
# HatcheryScatterTurns             (uint)   Turns a hen that scattered does not scatter again
# HatcheryFlutterPercent           (uint)   Chance (percent per turn) that an idle hen flutters up for a moment
# HatcheryScratchPercent           (uint)   Chance (percent per turn) that an idle hen scratches the ground
# HatcheryGrainReaction            (0/1)    1 = grain on the floor: a scratching hen eats some, it grows back, the keepers who see the hatchery see the grain get less and more (0 = the grain always looks full)
# HatcheryGrainLevels              (uint)   Levels of the grain of one tile (full = this number, 0 = bare)
# HatcheryGrainEatPercent          (uint)   Chance (percent) that a peck of a hen (scratching, picking, picking at the rooster's call) takes one level of grain from the tile she stands on
# HatcheryPeckIntervalTurns        (uint)   Turns between two pecks of one hen that count for the grain, whatever pose she pecks in
# HatcheryGrainRegrowPermille      (uint)   Chance (per mille per turn) that a tile that is not full gets one level of grain back; the same speed always, it does not depend on care, light, research or the state of the room
# HatcheryGrainSyncTurns           (uint)   Turns until a change of the grain is sent to the clients (changes in between are sent together)
# HatcheryGrainResyncTurns         (uint)   Turns after which the grain is sent again (also when every tile is full, so a lost message is made up for); a keeper who gains sight of the hatchery, joins or loads gets it at once
# HatcheryLayMin                   (uint)   Fewest turns between two eggs of one hen
# HatcheryLayMax                   (uint)   Most turns between two eggs of one hen
# HatcheryHatchTurns               (uint)   How many turns an egg needs to hatch (only while the hatchery has a rooster)
# HatcheryGrowTurns                (uint)   How many turns a chick needs to grow into a hen
# HatcheryRoosterSpawnRate         (uint)   How many turns a hatchery with coops but no rooster waits until a rooster comes out of a coop
# HatcheryTilesPerChicken          (uint)   Hatchery tiles needed for one hen, chick or egg (the number of coops limits it too)
# HatcheryDayTurns                 (uint)   Turns of a whole day for the hatchery animals (0 = no night)
# HatcheryNightPercent             (uint)   Part of the day (percent, at its end) that is night: hens, chicks and the rooster sleep
# HatcheryRoosterCrowMin           (uint)   Fewest turns between two crows of the rooster
# HatcheryRoosterCrowMax           (uint)   Most turns between two crows of the rooster
# HatcheryRoosterChasePercent      (uint)   Chance (percent per turn) that the strutting rooster chases a hen
# HatcheryRoosterLeadPercent       (uint)   Chance (percent per turn) that the strutting rooster leads the chicks
# HatcheryRoosterPerchPercent      (uint)   Chance (percent per turn) that the strutting rooster sits on a coop roof
# HatcheryRoosterPerchTurns        (uint)   Turns the rooster stays on the roof
# HatcheryRoosterChaseTurns        (uint)   Turns the rooster runs after a hen at most
# HatcheryRoosterGuardTurns        (uint)   Turns the rooster defends the flock against a creature
# HatcheryRoosterLeadTurns         (uint)   Turns the rooster leads the chicks
# HatcheryRoosterCallPercent       (uint)   Chance (percent per turn) that the strutting rooster scratches up food and calls the hens to him
# HatcheryRoosterCallTurns         (uint)   Turns the rooster calls the hens
# HatcheryRoosterGuardRadius       (double) Tiles around the rooster in which a creature after the chickens (or an enemy) makes him defend the flock
# HatcheryCoopRoofHeight           (double) Height above the floor of the coop roof where the rooster sits
# HatcheryCoopPerchOffset          (double) Distance from the coop tile center along the tile to the middle of the roof
# HatcheryChickGap                 (double) Distance in tiles a chick keeps to the animal in front of it
# HatcheryChickScale               (double) Size of the chick mesh compared to a hen (look only)
# HatcheryRoosterScale             (double) Size of the rooster mesh compared to a hen (look only)
# HatcheryCooldownChickenMin        (uint)   How many turns a creature will stay idle after eating a chicken minimum
# HatcheryCooldownChickenMax        (uint)   How many turns a creature will stay idle after eating a chicken maximum
# HatcheryGiftOfferTurns           (uint)   Turns after the keeper dropped a hen outside a hatchery in which it is offered to a creature that is not hungry (0 = never)
# HatcheryGiftOfferRadius          (double) Tiles around the dropped hen within which an idle creature of the keeper takes the offer
# HatcheryGiftSniffTurns           (uint)   Turns the creature sniffs at the gift before it goes for it
# HatcheryGiftHungerPerChicken     (double) How much hunger decreases when a creature eats a gift chicken without being hungry (smaller than a normal meal)
# HatcheryGiftHpRecoveredPerChicken (double) How much HP is recovered by a gift chicken
# HatcheryGiftCooldownMin          (uint)   How many turns a creature will stay idle after eating a gift chicken minimum
# HatcheryGiftCooldownMax          (uint)   How many turns a creature will stay idle after eating a gift chicken maximum
# HatcheryReturnPathTiles         (uint)   Tiles a hen or rooster outside a hatchery walks per leg on its way back to a hatchery of its keeper
# HatcheryReturnSearchTiles       (uint)   Most tiles looked at when searching the way back to a hatchery (a longer way counts as no way)
# HatcheryReturnRetryTurns        (uint)   Turns a hen waits before it searches the way back again after it found none (it dies after 30 turns outside without one)
# HatcheryReturnMaxTurns          (uint)   Turns a hen may be on its way back to a hatchery; after that the 30 turn rule applies again (0 = never gives up)
# TrainHallCostPerTile              (int)    Cost per tile for training hall room
# TrainHallCostPerSecond            (double) Gold the keeper pays per second for each creature in training. No training when the treasury is empty
# TrainHallXpPerAttack              (double) How many experience a creature gets for each blow
# TrainHallWakefulnessPerAttack     (double) How many wakefulness a creature looses for each blow
# TrainHallCooldownHitMin           (uint)   How many turns a creature will stay idle after hitting a dummy minimum
# TrainHallCooldownHitMax           (uint)   How many turns a creature will stay idle after hitting a dummy maximum
# TrainHallBonusWallActiveSpot      (double) Bonus percent points that a creature while training for each wall active spot
# TrainHallMaxTrainingLevel         (uint)   Defines the maximum level a creature can reach by training in the training room
# CryptCostPerTile                  (int)    Cost per tile for crypt room
# CryptRotNbTurns                   (uint)   How many turns a creature will rot before its max hp are added to the crypt
# CryptBonusWallActiveSpot          (double) Bonus percent points that a crypt will get per rotten creature for each wall active spot
# CryptPointsForSpawn               (uint)   How many points are needed for the crypt creature to spawn
# CryptSpawnClass                   (string) Class of the creature that will spawn when the given points are gathered
# WorkshopCostPerTile               (int)    Cost per tile for Workshop room
# WorkshopPointsPerWork             (double) How many points the Workshop gets for each work turn (per creature efficiency point)
# WorkshopWakefulnessPerWork        (double) How many wakefulness a creature looses for each work turn
# WorkshopCooldownWorkMin           (uint)   How many turns a creature will stay idle after working minimum
# WorkshopCooldownWorkMax           (uint)   How many turns a creature will stay idle after working maximum
# TreasuryCostPerTile               (int)    Cost per tile for treasury room
# DormitoryCostPerTile              (int)    Cost per tile for dormitory room
# DormitoryWoundedCarryHpPercent    (double) A creature of the keeper below this share of its maximum HP (percent) is pulled to its bed by a free worker (by the legs, over the ground) when no fight is going on (0 = never)
# DormitoryWoundedCarryRadius       (double) Tiles around the worker within which it notices such a creature
# DormitoryWoundedCarryPriority     (uint)   Priority of this task against the other things a worker carries or pulls: 0 = lowest, 1 = like gold, 2 = like a creature knocked out to death
# DormitoryWoundedCarryCooldown     (uint)   Turns before the same creature can be pulled again (also after an interrupted pull)
# DormitoryWoundedKoDeathCooldown   (uint)   Same pause for a creature knocked out to death (its counter to death keeps running, it just is not pulled again at once)
# DormitoryWoundedCarryEnemyRadius  (double) Tiles within which a hostile creature stops the pulling (the creature is let go) or keeps it from starting
# DormitoryWoundedCarryMaxTurns     (uint)   Longest time (turns) a worker pulls a hurt creature before it lets go
# DormitoryWoundedCarryTempKo       (uint)   1 = a creature that is knocked out for a while may be pulled too, 0 = only creatures that are awake
# DormitoryWoundedDragGap           (double) Tiles the pulled creature lies behind the worker (it follows the way of the worker at this distance)
# DormitoryWoundedDragWorkerSpeedFactor (double) Share of its normal speed a worker walks at while it pulls a hurt creature (0.1 to 1)
# DormitoryWoundedDragFollowSpeedFactor (double) How much faster than the worker the pulled creature slides along the way (at least 1, so it never falls behind)
# DormitoryWoundedDragMaxDistance   (double) Tiles between worker and pulled creature above which the worker lets go (left behind)
# DormitoryWoundedDragLayTurns      (uint)   Turns the creature gets to slide the last steps into its bed once the worker is there
# DormitoryWoundedDragWorkerClip    (string) Clip of the worker skeleton played while it pulls (backwards walk, legs in the hands)
# DormitoryWoundedDragCreatureClip  (string) Clip of the pulled creature (lies on the ground, pulled by the legs)
# DormitoryWoundedDragWorkerFallbackClip   (string) Clip a worker skeleton without the clip above plays instead
# DormitoryWoundedDragCreatureFallbackClip (string) Clip a creature skeleton without the clip above plays instead (it lies still on its last frame)
# LibraryCostPerTile                (int)    Cost per tile for library room
# LibraryPointsPerWork              (double) How many points the library gets for each work turn (per creature efficiency point)
# LibraryWakefulnessPerWork         (double) How many wakefulness a creature looses for each work turn
# LibraryCooldownWorkMin            (uint)   How many turns a creature will stay idle after working minimum
# LibraryCooldownWorkMax            (uint)   How many turns a creature will stay idle after working maximum
# LibrarySkillPointsBook            (uint)   How many points have to be researched to create a book
# PortalCooldownSpawnMin            (uint)   How many minimum turns a portal will be inactive after spawning a creature
# PortalCooldownSpawnMax            (uint)   How many maximum turns a portal will be inactive after spawning a creature
# PrisonCostPerTile                 (int)    Cost per tile for prison room
# PrisonDamagePerTurn               (double) Damages per turn done by the prison room (ignores physical and magical defense)
# PrisonOverstuffBreakChance        (double) Chance per second that a prisoner beyond the prison capacity breaks out
# WoodenBridgeCostPerTile           (int)    Cost per tile for wooden bridge room
# WoodenBridgeLavaBurnSeconds       (double) Seconds a wooden bridge tile over lava lasts before it burns down (0 = never)
# StoneBridgeCostPerTile            (int)    Cost per tile for stone bridge room
# ArenaCostPerTile                  (int)    Cost per tile for arena room
# ArenaMaxTrainingLevel             (uint)   Defines the maximum level a creature can reach by training in the arena room
# ArenaDamageTakenPercent           (double) Share of the normal combat damage a creature takes when fighting another creature inside the arena (1.0 = full damage)
# PitMoodVictor                     (double) Mood points the last creature standing gets when a fight in the pit ends
# PitMoodSpectator                  (double) Mood points per second a creature of the owner gets while watching a fight in the pit
# PitMoodSolitary                   (double) Mood points per second a creature gets while it is alone in the pit (negative annoys)
# PitSpectatorRadius                (double) Distance in tiles from a pit tile in which a creature counts as a spectator
# PitMoodMax                        (double) Highest and lowest value the pit mood of a creature can reach
# PitMoodDecay                      (double) Mood points per second the pit mood of a creature fades towards 0
# HatedCompanyRadius                (double) Distance in tiles in which a creature of the opposite alignment (hero faction creatures are good) annoys (see the HatedCompany mood modifier)
# CasinoCostPerTile                 (int)    Cost per tile for casino room
# CasinoWakefulnessPerWork          (double) How many wakefulness a creature looses for each work turn
# CasinoCooldownWorkMin             (uint)   How many turns a creature will stay idle after working minimum
# CasinoCooldownWorkMax             (uint)   How many turns a creature will stay idle after working maximum
# CasinoBet                         (int)    Bet per creature when playing
# CasinoFee                         (double) Percentage of money the keeper will get from the creature bets (between 0.0 and 1.0)
# CasinoFeeStingy                   (double) Same as CasinoFee when the player sets the payout to Money. Optional, defaults to CasinoFee
# CasinoFeeGenerous                 (double) Same as CasinoFee when the player sets the payout to Smiles. Optional, defaults to CasinoFee
# CasinoMoodSmiles                  (double) Mood points per second every creature in a casino set to Smiles gets (positive cheers up)
# CasinoMoodMoney                   (double) Mood points per second every creature in a casino set to Money gets (negative annoys)
# CasinoMoodMax                     (double) Highest and lowest value the casino mood of a creature can reach
# CasinoMoodDecay                   (double) Mood points per second the casino mood of a creature fades towards 0
# TortureCostPerTile                (int)    Cost per tile for torture room
#                                            It will be used once per torture session
# TortureSessionLengthMin           (uint)   How many turns a torture session lengths minimum (must be enough for torture animations) 
# TortureSessionLengthMax           (uint)   How many turns a torture session lengths maximum (must be enough for torture animations) 
# TortureDamagePercentPerSecond     (double) Share of its maximum health a tortured creature loses per second (ignores physical and magical defense)
# GuardRoomCostPerTile              (int)    Cost per tile for guard room
# GuardRoomWakefulnessPerDuty       (double) How many wakefulness a guard looses for each duty turn
# GuardRoomCooldownDutyMin          (uint)   How many turns a guard will wait before its next duty turn minimum
# GuardRoomCooldownDutyMax          (uint)   How many turns a guard will wait before its next duty turn maximum
# GuardRoomPatrolSeconds            (double) Seconds a guard serves in the room before it patrols to a watch banner
# GuardRoomPostStaySeconds          (double) Seconds a patrolling guard stays at a watch banner
# GuardRoomDistressSeconds          (double) Minimum seconds between two distress calls of the watch banners
# TempleCostPerTile                 (int)    Cost per tile for the temple
# TemplePrayerManaPerSecond         (double) Mana a praying creature gives per second when it has no TemplePrayerMana<ClassName> entry
# TemplePrayerMana<ClassName>       (double) Mana a praying creature of this class gives per second (e.g. TemplePrayerManaSkeleton)
# TemplePrayerWakefulnessPerTurn    (double) How many wakefulness a creature looses for each turn spent praying
# TemplePrayerReliefPerTurn         (int)    Mood points a praying creature gains for each turn spent praying
# TemplePrayerReliefMax             (int)    Maximum mood points a creature can hold from praying
# SpecialMoodDecayPerTurn         (int)    Mood points the Make Happy / Make Unhappy specials loose each turn
# TemplePrayerReliefDecayPerTurn    (int)    Mood points from praying a creature looses each turn
# TempleWorkersGiven                (int)    Number of workers given by the fork specific Workers result
# TempleRecipeCount                 (int)    Number of TempleRecipe entries
# TempleRecipeN                     (string) Sacrifice recipe: creature definition names joined by + then = and the result.
#                                            The inputs are listed in the order they are sacrificed, the pool remembers the last 3
#                                            sacrifices and the first recipe that matches the newest ones wins (see docs/development/TEMPLE-SACRIFICE.md).
#                                            The result is a creature definition name (level = average of the inputs, rounded down)
#                                            or ManaBoost (a mana gift box that has to be brought to the dungeon temple)
#                                            or Workers (fork specific: workers of the keeper)

# Price scale (own rating, see docs/development/VALUE-SCALES.md): CostPerTile is gold per tile, a whole number
# rated by usefulness and upkeep; the treasury is the cheapest room and anchors the scale.

[Rooms]
    # What enemies can do to a room:
    #   0  rooms cannot be claimed, only destroyed
    #   1  enemy workers can take over a room (the default behaviour): the whole
    #      room has one health pool that every dance on any of its tiles lowers, and
    #      when it is empty all its tiles change hands at once. Fighters can still
    #      destroy rooms. Portals are taken over this way too, but never destroyed
    #   2  only workers can take a room; fighters leave rooms alone
    # The dungeon heart can never be taken over, so it stays destructible in every
    # mode: destroying it is how a player is defeated.
    # RoomConvertSecondsPerTile          takeover duration of one tile: seconds one level 1 worker needs per tile to take over an enemy room.
    #                                    The pool of a room is its number of tiles times this value (a 25 tile room: 62.5 seconds for one
    #                                    worker, a fifth of that for five). All workers on any tile of the room lower the same pool and the
    #                                    whole room changes hands at once when it is empty. The pool is a share of the room, so a room that
    #                                    grows or shrinks while it is worn down keeps that share and the time left follows its new size.
    #                                    A bridge is taken over the same way: all its squares together make the pool and change hands at once
    # RoomConvertNeutralSecondsPerTile   the same for a room that belongs to nobody
    # RoomConvertClaimRate               claim rate of that worker (ClaimRate of the worker in creatures.cfg)
    # RoomRepairFactor                   how many times faster an own worker repairs a worn down room than an enemy worker wears it down
    # RoomTakeoverGuardRadius            tiles around the tile a worker dances on in which a fighter (no worker, awake, not held) of the owner or its allies keeps the room safe; 0 = guards do not matter
    # RoomTakeoverCostPercent            share of the build cost of the tiles taken (a bridge: all its squares) that the taker pays from its treasuries when the room changes hands; 0 = free. A taker that cannot pay does not wear the room down
    # PortalFirstSpawnSeconds            seconds a taken over portal waits before its first creature for the new owner
    # SandboxRoomUnlockIntervalSeconds   seconds between two rooms becoming available in the sandbox (the rooms the level does not give at the start)
    RoomsClaimableByEnemies	1
    RoomConvertSecondsPerTile	2.5
    RoomConvertNeutralSecondsPerTile	0.5
    RoomConvertClaimRate	0.42
    PortalFirstSpawnSeconds	25
    RoomRepairFactor	5.0
    RoomTakeoverGuardRadius	5
    RoomTakeoverCostPercent	0
    SandboxRoomUnlockIntervalSeconds	120
