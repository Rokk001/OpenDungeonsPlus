# Dungeonbook appearance: whole creature portraits.
#
# Format: line based, columns separated by TAB, '#' starts a comment.
# Missing or bad entries fall back to the defaults in the code and are logged once.
#
#   AssetRoot          Folder that holds one sub folder per catalog id with its index.cfg.
#                      A relative path is resolved against the game data path.
#   MaxCachedPictures  Number of whole portraits kept at the same time (least recently used go first).
#   MaxCacheMegabytes  Memory limit of the whole portraits.
#
AssetRoot	materials/portraits/whole
MaxCachedPictures	64
MaxCacheMegabytes	64
