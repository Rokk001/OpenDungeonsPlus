# Extra room effects: wall torches, unmade beds, altar fire and bell, rats, turning gears, the hurt heart,
# the converted flash, startled chickens and the rooster. Client side only, nothing here changes the game.
# Format and keys: see config/roomAmbience.cfg. New keys used here:
#   When Vacated   the target was used while it was in view and has been empty for "After" seconds
#   WallSide yes   tiles: the effect sits at the edge of the tile that touches a wall (implies NeedWall)
#   HeartRate yes  the speed follows the beat of the player's dungeon heart (faster when it is hurt)
#   Sound <family> events: sound family played when the effect starts (only in the mode "full")
#   OwnerOnly yes  objects and events: only the keeper the object belongs to sees or hears the effect (the glint, dust,
#                  lock glow and opening sounds of a secret door); an event without a known owner is shown to nobody
#   Torch yes      tiles: only the tiles that carry a wall torch by the rule of the game (Room::hasTorchOn, RoomTorches):
#                  a room with torches, one tile in six, touching a wall reinforced by its keeper. The server counts the
#                  same torches as light for the care bonus of the hatchery, so no Spacing is given for them
# The events TempleHealed, ConvertedFlash, ChickenFlee, RoosterCrow and HeartHurt are started by the
# client from what it already knows (health stage, seat, hunger, heart health, objects on the map).
# Torches, rats and altar fire are tile effects with a spacing, so only some tiles get one.

[RoomAmbience]
    [Effects]
        ##### Wall torches (all rooms): bracket, flickering flame, warm light and a thread of smoke #####

        [Effect]
            Name        WallTorchBracket
            Target      Tile
            Match       dormitoryRoom libraryRoom workshopRoom trainingHallRoom treasuryRoom hatcheryRoom prisonRoom tortureRoom cryptRoom arenaRoom casinoRoom guardRoom templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbTorchBracket
            Offset      0 0 1.25
            Torch       yes
            WallSide    yes
            MaxDistance 16
            Priority    2
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WallTorchFlame
            Target      Tile
            Match       dormitoryRoom libraryRoom workshopRoom trainingHallRoom treasuryRoom hatcheryRoom prisonRoom tortureRoom cryptRoom arenaRoom casinoRoom guardRoom templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbTorchFlame
            Offset      0 0 1.4
            Flicker     0.25
            Speed       2.3
            Torch       yes
            WallSide    yes
            MaxDistance 16
            Priority    2
            Reduced     yes
        [/Effect]

        [Effect]
            Name        WallTorchGlow
            Target      Tile
            Match       dormitoryRoom libraryRoom workshopRoom trainingHallRoom treasuryRoom hatcheryRoom prisonRoom tortureRoom cryptRoom arenaRoom casinoRoom guardRoom templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbTorchGlow
            Offset      0 0 1.4
            Flicker     0.3
            Speed       1.7
            Torch       yes
            WallSide    yes
            MaxDistance 14
            Priority    1
        [/Effect]

        [Effect]
            Name        WallTorchSmoke
            Target      Tile
            Match       dormitoryRoom libraryRoom workshopRoom trainingHallRoom treasuryRoom hatcheryRoom prisonRoom tortureRoom cryptRoom arenaRoom casinoRoom guardRoom templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbTorchSmoke
            Offset      0 0 1.4
            Torch       yes
            WallSide    yes
            MaxDistance 12
            Priority    1
        [/Effect]

        ##### Dormitory: the blanket stays rumpled after the sleeper got up #####

        [Effect]
            Name        DormitoryUnmadeBed
            Target      Object
            Match       *Bed
            When        Vacated
            Kind        Particle
            System      RoomAmbRumple
            After       6
            Offset      0 0 0.5
            MaxDistance 14
            Priority    3
        [/Effect]

        ##### Temple: sacred fire on the floor, a bell rings when someone is healed #####

        [Effect]
            Name        TempleAltarFlame
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbAltarFlame
            Offset      0 0 0.1
            Flicker     0.22
            Speed       2.1
            Spacing     9
            MaxDistance 20
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TempleAltarGlow
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbEmberGlow
            Offset      0 0 0.55
            Flicker     0.25
            Speed       1.9
            Spacing     9
            MaxDistance 18
            Priority    3
        [/Effect]

        [Effect]
            Name        TempleAltarEmbers
            Target      Tile
            Match       templeRoom
            When        Always
            Kind        Particle
            System      RoomAmbEmbers
            Offset      0 0 0.5
            Spacing     9
            MaxDistance 14
            Priority    2
        [/Effect]

        [Effect]
            Name        TempleGongRing
            Target      Event
            Event       TempleHealed
            Kind        Particle
            System      RoomAmbGongRing
            Duration    2.5
            Sound       Rooms/Temple/Gong
            MaxDistance 30
            Reduced     yes
        [/Effect]

        [Effect]
            Name        TempleBellSparks
            Target      Event
            Event       TempleHealed
            Kind        Particle
            System      RoomAmbBellSparks
            Duration    2.2
            MaxDistance 26
        [/Effect]

        ##### Prison: rats run along the walls #####

