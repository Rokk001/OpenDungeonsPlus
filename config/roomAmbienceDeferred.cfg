            Name        PrisonRatRight
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbRatRight
            Spacing     7
            WallSide    yes
            MaxDistance 14
            Priority    2
        [/Effect]

        [Effect]
            Name        PrisonRatLeft
            Target      Tile
            Match       prisonRoom
            When        Always
            Kind        Particle
            System      RoomAmbRatLeft
            Spacing     7
            WallSide    yes
            MaxDistance 14
            Priority    2
        [/Effect]

        ##### Torture room and prison: a prisoner changed sides #####

        [Effect]
            Name        ConvertedFlash
            Target      Event
            Event       ConvertedFlash
            Kind        Particle
            System      RoomAmbConvertFlash
            Duration    1.2
            MaxDistance 34
            Reduced     yes
