        [Effect]
            Name        ConvertedRing
            Target      Event
            Event       ConvertedFlash
            Kind        Particle
            System      RoomAmbConvertRing
            Duration    1.6
            MaxDistance 30
        [/Effect]

        [Effect]
            Name        ConvertedSparks
            Target      Event
            Event       ConvertedFlash
            Kind        Particle
            System      RoomAmbSparkBurst
