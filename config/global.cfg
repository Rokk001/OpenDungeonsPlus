[/Dirt]
# Tavern, thirst and drinks. Every key is a number; the block is read by the server and the clients alike.
# Thirst is a need from 0 to 100 like hunger. Its growth per turn is ThirstGrowth/Turn of the creature type (creatures.cfg), the
# mood it costs is the Thirst line of the mood modifiers of the type. Times are turns (1.4 turns per second). Keys:
# ThirstSeek                  Thirst from which a creature looks for a tavern on purpose
# UrgeFromBeer                Urge (toilet need, [Dirt]) a creature gains for every beer
# UrgeFromWater               Urge a creature gains for every water
# BeerPrice                   Gold a beer costs, the same for every creature
# BeerMood                    Mood a creature gains for a beer
# BeerMoodTurns               Turns the beer mood lasts (a new drink starts it again)
# NoCoinMood                  Mood a creature loses when it pays for beer itself and its purse is too empty (it gets water)
# NoCoinMoodTurns             Turns that mood lasts
# DrinkTurns                  Turns a creature needs to drink one drink
# NextDrinkPercent            Chance (percent) of a second drink after the first; halved for every further drink
# MaxDrinksPerVisit           Most drinks a creature takes during one visit
# DrunkPerBeer                Drunkenness (0 - 100) a beer adds; water adds nothing
# DrunkDecayPerTurn           Drunkenness a creature loses per turn
# StaggerAt                   Drunkenness from which a creature staggers
# StaggerSpeedFactor          Factor on all move speeds of a staggering creature
# VomitAt                     Drunkenness from which a creature vomits once per drunk episode (a dirt pile of the kind vomit)
# HangoverAt                  Drunkenness above which a creature that falls asleep wakes up with a hangover
# HangoverTurns               Turns a hangover lasts (sleeping again does not shorten it)
# HangoverWorkFactor          Factor on the room points and the experience a creature with a hangover earns
# HangoverMood                Mood a creature loses once when it wakes up with a hangover
# GameChancePercent           Chance (percent) that a guest wants a game after its last drink; it then waits up to DrinkTurns turns for a neighbour
# GameTurns                   Turns an arm wrestling or dice game lasts
# GameWinnerMood              Mood the winner of a game gains
# GameLoserMood               Mood the loser of a slap duel gains (negative = loses)
# GameSpectatorMood           Mood a creature gains that watches a game
# GameSpectatorRadius         Tiles (largest distance in x or y) around the players in which creatures watch
# GameUnderdogBasePercent     Chance (percent) of the weaker creature to win arm wrestling or dice at equal level
# GameUnderdogPerLevel        Points that chance falls per level the other creature has more
# GameUnderdogMinPercent      The lowest chance (percent) of the weaker creature
# GameUnderdogMoodPerLevel    Mood the weaker creature gains on top of GameWinnerMood for every level of difference when it wins
# GameUnderdogMoodMax         The highest mood a winning weaker creature gains
# SlapDamage                  HP a normal slap of the slap duel takes
# SlapCritBasePercent         Chance (percent) of a critical slap at equal level
# SlapCritPerLevel            Points that chance changes per level of difference (own level minus the level of the opponent)
# SlapDuelLoseBelowHp         A creature whose HP fall below this value in a slap duel has lost
# DuelKoTurns                 Turns a creature that lost a slap duel lies on the floor
# GameWinnerXp                Experience the winner of a game gains (the weaker winner of arm wrestling or dice gains double)
# TavernNoticeSeconds         Seconds between two notices to the same keeper that creatures are thirsty and there is no tavern
[Tavern]
    ThirstSeek	80
    UrgeFromBeer	15
    UrgeFromWater	5
    BeerPrice	5
    BeerMood	100
    BeerMoodTurns	168
    NoCoinMood	-33.3333
    NoCoinMoodTurns	168
    DrinkTurns	4
    NextDrinkPercent	50
    MaxDrinksPerVisit	5
    DrunkPerBeer	25
    DrunkDecayPerTurn	0.5
    StaggerAt	50
    StaggerSpeedFactor	0.5
    VomitAt	75
    HangoverAt	50
    HangoverTurns	252
    HangoverWorkFactor	0.5
    HangoverMood	-66.6667
    GameChancePercent	50
    GameTurns	8
    GameWinnerMood	133.3333
    GameLoserMood	-66.6667
    GameSpectatorMood	66.6667
    GameSpectatorRadius	2
    GameUnderdogBasePercent	50
    GameUnderdogPerLevel	2.5
    GameUnderdogMinPercent	5
    GameUnderdogMoodPerLevel	33.3333
    GameUnderdogMoodMax	333.3333
    SlapDamage	10
    SlapCritBasePercent	10
    SlapCritPerLevel	0.25
    SlapDuelLoseBelowHp	30
