# Dirt, cleaning and toilets. Every key is a number; the block is read by the server and the clients alike.
# Tile dirt is 0 - 100 per tile; the mean over the tiles of a room gives its dirt stage (1 clean, 2 stains, 3 filth).
# The per-room dirt made by using a room (...DirtPer... keys) is in rooms.cfg, the per-type factors (UrgeGrowth/Turn,
# Cleanliness, DirtFactor) are in creatures.cfg. Keys:
# DirtVisibleFrom             Tile dirt (0 - 100) from which a floor tile shows a stain; below it the tile looks clean (the dirt still counts)
# DirtStage2At                Room dirt (mean of the dirt 0 - 100 of its tiles) from which the room is at dirt stage 2 (stains)
# DirtStage3At                Room dirt from which the room is at dirt stage 3 (filth). Below DirtStage2At the room is at stage 1 (clean)
# DirtMoodStage2              Mood a creature in a room at stage 2 loses, times the Cleanliness of its type (creatures.cfg)
# DirtMoodStage3              The same at stage 3
# DirtPileMood                Mood every creature within DirtPileRadius tiles of a pile loses (once per pile), times its Cleanliness
# DirtPileRadius              Tiles (largest distance in x or y) around a pile in which creatures mind it
# DirtOutputStage2            Factor on the output of a room at stage 2 (stage 1 = 1)
# DirtOutputStage3            Factor on the output of a room at stage 3
# UrgeSeek                    Urge (0 - 100) from which a creature looks for a toilet on purpose
# UrgeOnTheWay                Urge from which a creature uses a free toilet that lies on its way
# UrgeRelieve                 Urge at which a creature relieves itself where it stands
# UrgePerChicken              Urge a creature gains for every chicken it eats
# UrgePerDrink                Not used any more: a drink raises the urge by UrgeFromBeer or UrgeFromWater of the [Tavern] block
# ToiletUseTurns              Turns a creature needs to use a toilet or to relieve itself
# ToiletWaitRadius            Tiles around the toilet room in which a creature waits when every toilet is busy
# ToiletReserveFactor         A reserved toilet tile is released after ToiletUseTurns times this factor turns if its user never came
# CleaningWorkerSharePercent  Share of the workers (percent) that clean as a side job while there is dirt to clean
# CleanRoomFromStage          Dirt stage (2 or 3) from which workers clean a room
# CleanRateFactor             Factor on the dirt a worker removes per turn (claim rate x 100 x this factor)
# CleaningMaxTurnsPerTile     Most turns a worker cleans one tile before it takes its next job
# CombatDirtPerHit            Dirt every blow or shot that lands adds to the tile of its target (and a corpse adds per turn to its tile)
# TrailDirtPerTile            Dirt a worker carrying a load, a worker pulling a wounded creature and (times creature dirt / 100) a dirty creature add to every tile they enter
# CreatureDirtPerFightWon     Creature dirt (0 - 100) a creature gains when a fight ends without it being knocked out
# CreatureDirtPerKo           Creature dirt (0 - 100) a creature gains the moment it is knocked out (that fight's end then adds nothing)
# CreatureDirtDecayPerTurn    Creature dirt a creature loses per turn
# BloodDryTurns               Turns until a blood stain dries and is removed (its tile keeps the dirt)
# DirtNoticeSeconds           Seconds between two dirt notices to the same keeper (the rest are dropped)
# FilthyPostSeconds           Seconds before the same creature posts again about the same filthy room (social feed)
# DirtSyncTurns               Turns until a change of the dirt of a tile is sent to the clients (changes in between are sent together)
# DirtResyncTurns             Turns after which the dirt of all tiles is sent again; a keeper who gains sight, joins or loads gets it at once
# TortureDirtConvertStage2    Divisor of the mood a tortured creature loses per second in a torture chamber at stage 2 (below 1 = faster)
# TortureDirtConvertStage3    The same at stage 3
[Dirt]
    DirtVisibleFrom	10
    DirtStage2At	33.3333
    DirtStage3At	66.6667
    DirtMoodStage2	-100
    DirtMoodStage3	-200
    DirtPileMood	-100
    DirtPileRadius	2
    DirtOutputStage2	0.75
    DirtOutputStage3	0.5
    UrgeSeek	80
    UrgeOnTheWay	75
    UrgeRelieve	100
    UrgePerChicken	5.962
    UrgePerDrink	15
    ToiletUseTurns	4
    ToiletWaitRadius	1
    ToiletReserveFactor	3
    CleaningWorkerSharePercent	20
    CleanRoomFromStage	2
    CleanRateFactor	1
    CleaningMaxTurnsPerTile	20
    CombatDirtPerHit	1.7722535834718596
    TrailDirtPerTile	0.16117467584896703
    CreatureDirtPerFightWon	5
    CreatureDirtPerKo	25
    CreatureDirtDecayPerTurn	0.1
    BloodDryTurns	168
    DirtNoticeSeconds	60
    FilthyPostSeconds	600
