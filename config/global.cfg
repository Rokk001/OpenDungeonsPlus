# Item rolls use these values without tuning or rounding their probabilities.
# Hero item and potion chances are Base + PerLevel * level; quality steps use level - 1.
# Common quality is the remainder after Poor, Rare and Epic. Portal values are direct chances.
# HeroSpecialPotionShare applies separately to Lifespring and Thaw from HeroSpecialPotionLevel.
# ItemBagIdleTurns delays worker collection until a loose bag has been idle for that many turns.
[ItemDrops]
    HeroItemBase 0.35
    HeroItemPerLevel 0.01
    DropPoorBase 0.60
    DropPoorPerLevel -0.02
    DropRareBase 0.04
    DropRarePerLevel 0.02
    DropEpicBase 0.01
    DropEpicPerLevel 0.006206896551724138
    HeroPotionBase 0.30
    HeroPotionPerLevel 0.01
    HeroSpecialPotionShare 0.05
    HeroSpecialPotionLevel 15
    PortalCommon 0.03
    PortalRare 0.005
    ItemBagIdleTurns 60
[/ItemDrops]
# Bonus weights used with the creature's own path and family weights.
# Each bonus contributes its value times this weight times the item's path weight.
# Dig%, Claim% and Carry% contribute only for workers; quality and effects add separate points.
[ItemRating]
    Damage% 1.2
    MaxHP% 1.1
    CritChance 1.2
    Cooldown% 0.9
    Avoid 1.2
    AttackRating% 0.25
    DefenseRating% 0.25
    Defense% 0.2
    DamageAttribute 6
    Life 6
    Mana 2
    MoveSpeed% 0.5
    ManaCost% 0.4
    Wakefulness% 0.2
    Dig% 1.0
    Claim% 1.0
    Carry% 0.5
[/ItemRating]
# Share of maximum health below which a slotted healing potion is drunk.
[Potions]
    PotionDrinkHpBelow 0.4
[/Potions]
# Keys added or moved from the code by the rebalance (meaning, unit and range); [GameConfig] keys:
# AngryFleeChancePercent             (double, percent 0-100) Chance that an angry creature flees instead of attacking
# AutoWorkerIntervalSeconds          (double, seconds) Seconds between two automatic worker summons of a keeper that has fewer workers than its target
# BuildingDamageCurve                (10 doubles, factor) Power factors at evenly spaced creature levels from 1 to the highest power level; the levels in between are interpolated linearly
# ClaimXpDivisorBase                 (double) Base of the level divisor of the experience for claiming or repairing a tile
# ClaimXpDivisorPerLevel             (double) Part of that level divisor that grows with each creature level
# ClaimXpFactor                      (double, factor) Factor on the experience a creature gets for claiming or repairing (applied to the claim rate divided by the level divisor)
# DigXpFactor                        (double, factor) Factor on the experience a creature gets for digging
# FightWakefulnessPerAttack          (double, wakefulness points) Wakefulness a creature loses for every attack it makes in a fight
# FindHomeChance                     (double, chance 0-1) Chance per idle decision that a creature without a lair looks for one
# FleeTiles                          (uint, tiles) Tiles a fleeing creature runs away
# GiftBoxGold                        (uint, gold) Gold a gift box of the kind gold gives
# GiftBoxLevels                      (uint, levels) Levels a gift box of the kind level up gives
# GiftBoxMana                        (uint, mana) Mana a gift box of the kind mana gives
# GiftBoxStunSeconds                 (double, seconds) Seconds the enemy workers stay down after the gift box Stun workers
# GiftBoxWorkers                     (uint, workers) Workers a gift box of the kind workers gives
# GoldDigXpFactor                    (double, factor) Factor on the experience a creature gets for digging a gold tile
# HitChanceMax                       (double, percent) Highest hit chance of an attack
# HitChanceMin                       (double, percent) Lowest hit chance of an attack
# HitChanceScale                     (double, percent) Scale coefficient of the hit formula
# HungerSeek                         (double, hunger 0-100) Hunger from which a creature looks for food, stops working and interrupts every activity except a fight
# LavaDamageScalesWithHp             (bool 0/1) 1: the lava damage per second is multiplied by the HP curve of the level of the victim
# ManaIncomeTilesCap                 (uint, tiles) Most claimed tiles that count for the mana income
# ManaPerClaimedTilePerSecond        (double, mana per second) Mana income of every claimed tile (up to ManaIncomeTilesCap)
# NaturalEnemyEngageChance           (double, chance 0-1) Chance that a creature engages a natural enemy it sees
# NaturalFullHealSeconds             (double, seconds) Seconds an awake creature needs to heal from 0 to full HP, at every level (natural healing)
# SkillDeviationPoints               (uint, points) Skill tree: points by which a creature may deviate from its template
# SkillResetMinFollowers             (uint, creatures) Skill tree: fewest followers of a template for the reset rule
# SkillTier2UnlockRanks              (uint, ranks) Ranks needed in tier 1 of a path to unlock tier 2
# SkillTier3UnlockRanks              (uint, ranks) Ranks needed in tier 2 of a path to unlock tier 3
# SkillTier4MinSpent                 (uint, points) Skill points that must be spent to unlock the tier 4 skill
# SkillUnfollowedWeight              (double) Skill tree: weight of the unfollowed template in the skill choice
# SlapDamage                         (double, HP) HP a slap of the keeper hand takes from every creature, whatever its level
# SlapJobCooldownFactor              (double, factor) Factor on the job cooldown of a creature after a slap
# SlapMemoryMax                      (uint, slaps) Most slaps a creature remembers for its mood
# SleepSeekWakefulnessMax            (double, wakefulness) Upper end of the random wakefulness below which an idle creature looks for a bed
# SleepSeekWakefulnessMin            (double, wakefulness) Lower end of the same roll
# SpeedGrowthPerLevel                (double, informative) Relative growth of every move speed per level; the per-type */Level keys of creatures.cfg carry it, no code reads this key
# StealGoldTryChance                 (double, chance 0-1) Chance that a thief tries to steal gold when it has the chance
# SupportTargetDistanceFactor        (double, factor) Factor on the squared distance of a potential target for the combat class Support
# TargetThreatFactorMax              (double, factor) Highest value of the threat factor in the target choice
# TargetThreatFactorMin              (double, factor) Lowest value of the threat factor in the target choice
# ThreatPercentByLevel               (10 doubles, percent) Threat of a creature by level 1 to 10; above level 10 the last step of the table is continued
# TileDugXp                          (double, experience) Experience a creature gets when it finishes digging a tile
# TunnelTryChance                    (double, chance 0-1) Chance that a creature tries to tunnel when it has the chance
# UndeadHealFactor                   (double, factor) Factor on the healing of the undead (Skeleton, Lich)
# UnpaidWagesLeave                   (uint, wages) Missed wages at which a creature leaves the dungeon
# UnpaidWagesStopWork                (uint, wages) Missed wages at which a creature stops working until it is paid
# WeakFleeChancePercent              (double, percent 0-100) Chance that a weak creature flees
# WorkXpRateDivisor                  (double) Divisor of the work rate in the experience of digging, claiming and cleaning
# WorkerCarryFirstMaxShare           (double, share 0-1) Carrying is tried first as long as the carrying share of the counted workers is at most this
# WorkerClaimWallFirstMinShare       (double, share 0-1) Claiming walls is tried first when the digging and ground claiming share is above this
# WorkerManaShortageSeconds          (double, seconds) Seconds of mana shortage after which the workers start to leave
# WorkerManaUpkeepPerSecond          (double, mana per second) Mana the workers cost per second
# WorkerPopCountdownSeconds          (double, seconds) Seconds between two workers that leave during a mana shortage
# StealItemChancePerIdle             (double, chance 0-1) Chance per idle decision that a creature tries to steal an item
[GameConfig]
