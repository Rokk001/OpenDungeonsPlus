    SoulCrystalHeroRareStart 0.04
    SoulCrystalHeroRareEnd 0.62
    # CorpseLieSeconds: uncarried seconds before decay; CorpseDecaySeconds: decay everywhere.
    CorpseLieSeconds	120
    CorpseDecaySeconds	240
# Maximum creature number. This is used for lagging purpose and a seat cannot control more creatures
    MaxCreaturesPerSeatAbsolute	30
# Maximum creature number a seat can control without portal
    MaxCreaturesPerSeatDefault	10
# CreaturesPerPortal: creatures more a seat can control for each of its portals (before the keeper skill Dominion)
    CreaturesPerPortal	5
# Percent of its HP a creature will lost when slapped
# Damage per second a creature takes while standing on lava without a bridge (creatures that can walk on lava take none)
    LavaDamagePerSecond	50
# How many turns a creature will stay working even if sleepy/hungry after being slapped
    SlapEffectDuration	20
# Wakefulness at or below which a creature is tired (mood bit Tired)
    TiredWakefulness	20
# Factor on the walking speed of a tired creature (1 = no slowdown, lowest value used 0.2)
    TiredWalkSpeedFactor	0.8
# Factor on the walking speed of a badly hurt creature (0.7 = 30 percent slower, 1 = no slowdown, lowest value used 0.2)
    LowHealthWalkSpeedFactor	0.7
# How much bigger than its base size a creature of the highest level (30) is shown: level 1 has the base size, the size
# grows linearly with the level (factor 1 + value x (level - 1) / 29), so 0.10 makes a level 30 creature 10 percent bigger
# (0 = all levels the same size, limited to 0 - 1). Server and clients read the same value.
    CreatureLevelGrowthMax	0.10
# Creature level curves (all creature types share them). The damage multiplier of a creature at level L is
# 1 + CreatureDamageGrowth x (L - 1) ^ CreatureDamageExponent (level 10: 3.871, 20: 7.866, 30: 12.246). Physical, magical and
# element damage and the channel defenses follow it.
    CreatureDamageGrowth	0.221
    CreatureDamageExponent	1.167
# The health multiplier is the damage multiplier x (1 + CreatureHpGrowthPerLevel x (L - 1)) (level 10: 4.498, 20: 10.556,
# 30: 18.639), so fights at higher levels last at least as long.
    CreatureHpGrowthPerLevel	0.018
# Share of the attack and skill cooldown that is saved per level above 1. 0 = the cooldowns are the same at every level.
    CooldownReductionPerLevel	0
# Creature attributes, mana, critical hits and skill trees (all creature types share these values).
# Critical chance in percent = CritChancePerDexterity x (start Dexterity of the creature type + equipment Dexterity) +
# CritChancePerLevel x (level - 1) + CritChanceBonus of the type + critical passives + equipment CritChance (no upper limit).
    CritChancePerDexterity	0.2
    CritChancePerLevel	0.3
# Factor on every damage value of a critical hit, applied before the target's defense is subtracted
    CritDamageMultiplier	2
# Seconds an empty mana pool needs to refill completely (the pool regenerates a little every turn)
    ManaRefillSeconds	120
# Mana a caster pays for every shot of its first MissileLaunch attack, and mana the second MissileLaunch of the Dragon
# costs per shot
    ManaPerCasterShot	2.5
    ManaPerDragonSecondShot	5
# Skill points: the level of the first point (one more point at every level above it) and the highest rank of a skill
    SkillPointFirstLevel	10
    SkillRanksPerSkill	5
# Chance in percent that a skill point goes to the alternative path of the creature's template instead of the template order
    SkillTemplateDeviationPercent	25
# Number of eaten chickens that opens the reset window, and how many seconds the window stays open
    SkillRespecChickens	2
    SkillRespecWindowSeconds	60
# Calibration constant of the damage scaling of creature spells: the damage is also multiplied by own MinHP / this value
    SkillSpellReferenceMinHP	86.1
# Health fractions below which creatures use heal skills: on itself, on an ally within range, and on an area; and the
# number of own creatures (self included) below the area limit that make a creature use an area heal
    SkillHealSelfBelow	0.6
    SkillHealAllyBelow	0.6
    SkillHealAreaBelow	0.7
    SkillHealAreaMinCreatures	2
# Share of its gold capacity a worker gains for every Strength point above its start Strength
    GoldCarryPerStrength	0.01
# A creature with less than this percent of its health is badly hurt and walks slower (used 1 - 100). It is measured
# in the health steps that every player sees (the 6 steps of the health bar), so the real limit is the nearest step
    LowHealthWalkThresholdPercent	50
# Number of steps in which the server tells the keepers who see a dungeon heart how hurt it is
# (cosmetic event heartHealthStage, only drives the beat of the heart, used 2 - 20)
    HeartHealthStages	5
# 1 = send the steps of foreign hearts (0 = only the owner knows the health, every heart beats calmly for the others)
    HeartHealthStageEvents	1
# 1 = tell the keepers what every blow and shot of a creature really did (cosmetic event hitResult: hit, glancing,
# blocked, shot missed; the game has no random miss or dodge). Only drives the looks of the fighters, 0 = send nothing
    HitEvents	1
# A blow that lets through less than this share of its damage counts as glancing (0.01 - 0.9)
    HitGlanceShare	0.34
# A hit that takes at least this share of the maximum health of its target is a strong one (0.01 - 1)
    HitStrongShare	0.15
# 1 = tell the keepers that a creature turns to its target before a blow or shot (cosmetic event attackTurn), 0 = send
# nothing (the clients then turn in a short fixed time as before). Only drives the looks, never the damage or its timing.
    AttackTurnEvents	1
# Angular speed of that turn in degrees per second (client, 90 - 1440)
    AttackTurnSpeed	540
# The strike clip waits for the turn at most this many seconds, a longer turn runs over the wind-up (client, 0 - 0.6)
    AttackTurnMaxDelay	0.25
# 1 = landed attacks can be dodged, parried or shield blocked according to the creature type; avoidance cancels
# damage without changing timing or cooldown. 0 = avoidance disabled. The chances below are in percent.
    MeleeDodgeParry	1
# Dodging, only for dodge creatures: base + per level, at most max. The chance does not change with the level
# (the value a level 15 creature had with base 3 and 0.5 per level).
    DodgeBase	10.5
    DodgePerLevel	0
    DodgeMax	15
# Parrying, only for parry creatures carrying a weapon: base + per level, at most max
# (fallback for weapons that set no ParryBase / ParryPerLevel / ParryMax of their own in equipments.cfg)
# The chance does not change with the level (the value a level 15 creature had with base 3 and 0.5 per level).
    ParryBase	10.5
    ParryPerLevel	0
    ParryMax	15
# Shield blocking, only for block creatures carrying a shield: base + per level, at most max. The chance does not
# change with the level (the value a level 15 creature had with base 6 and 1 per level).
    ShieldBlockBase	21
    ShieldBlockPerLevel	0
    ShieldBlockMax	25
# How many seconds between 2 pay days
