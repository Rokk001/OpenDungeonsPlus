# Creature definition file.
# Jobs (efficiency): Library Orc 3.0, Cultist 1.5, Rat 0.5; Wizard 3.0, Monk 1.0, Slime 0.5.
# Workshop Goblin 2.0, LavaSpawn 1.2, LizardMan 0.8, Rat 0.4; Dwarf1 2.0, Dwarf2 1.5, Scarab 0.6, Slime 0.4.
# HerbGarden CaveHornet 1.5, Roach 1.0, Spider 0.5; NatureMonster 1.5, Elf 1.2, Monk 1.0.
# AlchemyLab LizardMan 1.5, DarkElf 1.0, LavaSpawn 0.5; Elf 1.5, NatureMonster 1.0, Adventurer 0.5.
# GhostRoom likeness 0: PitDemon / RunelordDwarf 3.0, Troll / Knight 1.5, Skeleton / Defender 0.5.
# Each Creature definition is defined with [CreatureDefinitions] [/CreatureDefinitions]
# within a [Creature] [/Creature] tag couple.
# The creatures initial stats are parsed within the [Stats] [/Stats] tag couple.
# The creatures XP table is parsed within the [XP] [/XP] tag couple.
# It represents the amount of Experience points needed to reach the next level.
# The [CreatureSkills] tag lists the skills creatures can use. There is 1 skill per line and
# they are followed by the needed data depending on the skill
#
# Supported stats:
# Name               (Must be unique without spaces) The creature definition name.
# CreatureJob        (Can be 'Fighter' or 'Worker' atm). Fighters train, defend your dungeon and attack enemies,
#                     workers will dig and claim tiles. When idle, fighters with a digRate > 0 can dig tiles as indicated
#                     by the Keeper.
# CombatClass        (Optional, default 'Blocker'. 'Blocker', 'Blitzer', 'Flanker' or 'Support'). The role in group fights.
#                     Blocker and Support attack the nearest enemy, Support also keeps its distance. Blitzer and Flanker prefer
#                     enemy Support creatures, Flanker also tries to get behind its target.
# StealGold          (Optional, default 0). Gold taken from a free gold pile on the ground in one steal. Only creatures with a value > 0 (thieves)
#                     look for free gold, 0 means the creature never steals.
# PossessManaCost    (Optional, default 0). Mana taken per second while the player possesses a creature of this type, after the free period
#                     (PossessFreeSeconds in spells.cfg). 0 means the possession stays free. Same scale as the spell prices.
#                     The values come from one own scale: five fee tiers (40, 120, 240, 400, 600) derived as 0.8 times the former
#                     50/150/300/500/750 steps, so they stay sorted by creature strength. Change them here as needed:
#                       Workers and the Champion (Kobold, DwarfWorker, Champion)         0
#                       weakest fighters (Rat, Spider, CaveHornet, Slime, Adventurer,
#                         Gnome, Skeleton, Dwarf1, Dwarf2)                               40
#                       light fighters and casters (Cultist, Roach, Wyvern, Goblin,
#                         Monk, Wizard, DarkElf, Elf, TentacleAlbine/Green, LavaSpawn,
#                         LizardMan, Lich, RunelordDwarf, Kreatur, Troll)                120
#                       heavy fighters (Orc, PitDemon, Scarab, NatureMonster,
#                         Defender)                                                      240
#                       Knight                                                           400
#                       Dragon (top of the roster)                                       600
# AfraidOfGhosts     (Optional, default 0). 1 for non-worker types that flee from ghosts.
# Fearless           (Optional, default 0). 1 for creatures that a Fear trap never scares (the undead).
# Undead             Optional, default 0. 1 for the undead (Skeleton, Lich): lethal damage kills them directly, they are never knocked out, never reach the prison or the torture chamber, and leave no corpse and no soul.
# DeathVanishSeconds Optional, default 0 (the normal corpse rule). Seconds the body of the creature stays on the map after death (the length of its Die clip), then it is removed; it cannot be carried and gives no crypt corpse.
# DeathVanishPile    Optional, default 0. 1: a dirt pile of the creature kind is left where the body vanishes (the bone heap of the Skeleton) that workers clean.
# DeathVanishEffect  Optional, default none. Name of the effect started at the moment of death (the beetles of the Lich).
# Champion           (Optional, default 0). 1 for the creature the Summon champion spell calls: it takes no damage, cannot be possessed,
#                     turned, held in the hand or turned into a chicken, needs no fee, sleep or food, goes for the nearest enemy when
#                     idle and leaves when the owner's mana cannot pay it (see spells.cfg) or when it is slapped.
# LowHealthWalkSpeedFactor (Optional, default: the value LowHealthWalkSpeedFactor of global.cfg). Factor on the walking speed of a
#                     badly hurt creature of this type (1 = no slowdown, lowest value used 0.2). The server and the clients use it
#                     for the speed and for the walk clip alike. Not set for any type yet, so every type follows global.cfg.
# WalkClipRate       (Optional, default 1 = clips as authored, limits 0.2 - 8.0). Speed factor of the clips Walk and CarryWalk (WalkHurt too unless WalkHurtClipRate is set) of
#                     this type on the client, so that the planted feet keep up with the ground (value = GroundMoveSpeed / (distance the
#                     foot of the unscaled model travels per second of the clip while planted)). The creature scale of the level
#                     (1 + CreatureLevelGrowthMax x (level - 1) / 29, see global.cfg) is divided out in the game. Cosmetic: the move speed on the server does not change, and the
#                     factors for tired and badly hurt creatures still apply on top. Not set for types without feet on the ground
#                     (fliers, blobs and the gliding tentacle creatures TentacleAlbine and TentacleGreen, whose Walk clip has no planted foot and is meant to play at rate 1).
# WalkHurtClipRate   (Optional, limits 0.2 - 8.0). Own speed factor of the clip WalkHurt only (the limping walk of a badly hurt creature),
#                     for types whose WalkHurt strides differ from Walk. Fallback chain: WalkHurtClipRate, else WalkClipRate of the type,
#                     else 1. Walk and CarryWalk always keep WalkClipRate. The same rules as WalkClipRate apply (creature scale divided
#                     out, move speed on the server unchanged, tired and badly hurt factors on top). The rate follows the clip that
#                     plays, also when the creature becomes badly hurt or recovers while walking.
# MeshName            Indicates the creature model to load in the .mesh format, eg: Wyvern.mesh
# BedMeshName         The model used as a bed for the creature when it tags a dormitory location to sleep on. You'll have to omit the .mesh part.
# BedDim              Number of tiles the bed model will take in the X and Y axis.
# BedSleepPos         Position X,Y in the bed the creature should go to sleep (and orientation X,Y)
# MinHP               The minimum HP a creature has got when spawned.
# HP/Level            Minimum linear HP growth per level; the health curve also applies.
# AttackRating        Base attack rating at level 1 (default 300); equipment ratings are added.
# DefenseRating       Base defense rating at level 1 (default 100); equipment ratings are added.
# Avoidance           Optional none, dodge, parry or block (default none).
# Heal/Turn (double) Level-1 reference value of the healing per turn; not used for healing since the rebalance (healing is MaxHP / (NaturalFullHealSeconds x turnsPerSecond), x UndeadHealFactor for undead). Can be < 1.
# WakefulnessLost/Turn  The Wakefulness value lost per turn. (Can be < 1)
# HungerGrowth/Turn   The Hunger growth value per turn. (Can be < 1)
# UrgeGrowth/Turn    (Optional, default 0) How fast the urge to use a toilet grows per turn (0 - 100 scale like hunger, can be < 1).
#                     Set to the HungerGrowth/Turn of the type: a creature that never gets hungry never has the urge (workers, the undead,
#                     the Champion). The urge is +20 per eaten chicken, from 80 the creature looks for a toilet, at 100 it relieves itself.
#                     Rogue creatures and creatures in the hand are not affected. Values of global.cfg block [Dirt].
# ThirstGrowth/Turn  (Optional, default 0) How fast the thirst (0 - 100, like hunger) grows per turn (can be < 1). Set to the HungerGrowth/Turn of the type:
#                     a creature that never gets hungry never gets thirsty (workers, the Skeleton, the Lich, the Champion). A thirsty creature looks for
#                     a tavern from ThirstSeek on; the mood it costs is the Thirst line of [MoodModifiers] (same two numbers as the Hunger line of the type).
#                     Rogue creatures and creatures in the hand are not affected. Values of global.cfg block [Tavern].
# Cleanliness        (Optional, default 1, 0 - 2) How much the creature minds dirt: multiplies the mood it loses in a dirty room and near a pile
#                     (dirty races near 0, clean races up to 2).
# DirtFactor         (Optional, default 1, 0 - 2) Factor on the dirt the creature makes by using rooms and by the trails it leaves
#                     (blows it takes, blood, piles and hatchery animals do not use it):
#                     dirty races make more, the undead leave only dust.
#                       0.25 / 1.75  Rat, Roach, Spider, Slime, CaveHornet, Scarab                     (Cleanliness / DirtFactor)
#                       0.5  / 1.5   Orc, Troll, Goblin, PitDemon, LavaSpawn, TentacleAlbine, TentacleGreen, Wyvern, Kreatur, LizardMan
#                       0.5  / 0.25  Skeleton, Lich
#                       1.0  / 1.0   Kobold, DwarfWorker, Dwarf1, Dwarf2, RunelordDwarf, Gnome, Cultist, Dragon, NatureMonster, Champion
#                       1.5  / 0.75  Adventurer, Monk, Knight, Wizard, Defender
#                       2.0  / 0.5   Elf, DarkElf
# TileSightRadius     The number of tiles within which the creature can scan for enemies, tiles to dig, ...
# MaxGoldCarryable    The maximum gold amount a worker can carry before having to deposit it into a treasury
# DigRate             The percentage per turn the creature will reduce a wall's fullness when digging it.
# DigRate/Level       The dig rate growth per level.
#                     A fighter with a DigRate > 0 (tunneller, e.g. the hero Dwarf) digs through unclaimed walls towards an enemy dungeon heart it cannot reach on foot.
# ClaimRate           The percentage per turn the creature will claim a tile or wall.
# ClaimRate/Level     The claim rate growth per level.
# GroundMoveSpeed     The number of tile per second a creature can walk on ground tiles.
# WaterMoveSpeed      The number of tile per second a creature can walk on water tiles.
# LavaMoveSpeed       The number of tile per second a creature can walk on lava tiles.
# PhysicalDefense     The base physical defense at level 1
# PhysicalDef/Level   The physical defense earned at each level.
# MagicalDefense      The base magical defense at level 1
# MagicalDef/Level    The magical defense earned at each level.
# ElementDefense      The base elemental defense at level 1
# ElementDef/Level    The elemental defense earned at each level.
# FightIdleDist       Distance from the nearest enemy creature that the creature will try to let when no skill can be used
# FeeBase             Fee that the creature will claim at level 1
# FeePerLevel         Fee that the creature will claim for each level
# SkillDamageFactor  (Optional, default 1). Factor on every damage the skills of this type deal (Explosion, HailStorm, GasCloud, Grenade,
#                     GuidedBolt and the damage skills added later). It is the factor the type's attack damage was tuned with, so that a creature
#                     wins about half of its fights against two creatures of half its fee.
# Strength           (Optional, default 20) Start value (level 1, without equipment) of the attribute Strength. Strength raises the damage of
# Dexterity           the Melee line and the gold capacity of workers, Dexterity the damage of bow and crossbow lines, the attack and
# Life                defense rating and the critical chance base, Life the maximum hit points, Mana the size of the mana pool. The value
# Mana                of an attribute at level L is start value + points per level x (L - 1) + equipment bonus; its attribute level is
#                     1 + (value - start value) / points per level (the creature level L when the points per level are 0), and the derived
#                     values use the attribute level instead of L. Without equipment the attribute level equals the creature level.
# StrengthPerLevel   (Optional, defaults 1 / 2 / 1 / 1; the four values add up to 5) Attribute points gained per level.
# DexterityPerLevel
# LifePerLevel
# ManaPerLevel
# ManaPerPoint       (Optional, default 1.5) Size of the mana pool per Mana point: maximum mana = Mana(L, with equipment) x ManaPerPoint.
# CritChanceBonus    (Optional, default 0) Critical chance of this type in percent, added to the chance from Dexterity and level
#                     (global.cfg CritChancePerDexterity and CritChancePerLevel).
# SkillGroup         (Optional, default none) Skill group of the type: blocker, blitzer, flanker, archer, caster, worker or none.
# SkillFamily        (Optional, default none) Family path of the type (lower case family id) or none.
# PreSkill           (Optional, default none) Id of the skill that the type has at rank 1 from level 1 for free, or none.
# TierFourSkill      (Optional, default none) Id of the tier 4 skill of the type, or none.
# SleepHeal           (Optional, default 1). 0 = this type never heals in bed; any other value: the bed heals MaxHP in DormitoryFullHealSeconds (rooms.cfg).
# TurnsStunDropped    How many turns the creature will stay stunned after being dropped
# CreatureMoodName    Name of the creature mood modifier that should be used to compute the creature mood
# SoundFamilyPickup   Path to the sound that should be played when the creature is picked up
# SoundFamilyDrop     Path to the sound that should be played when the creature is dropped
# SoundFamilyAttack   Path to the sound that should be played when the creature attacks
# SoundFamilyDie      Path to the sound that should be played when the creature dies
# SoundFamilySlap     Path to the sound that should be played when the creature is slapped
# RoomAffinity        Defines which rooms the creature will want and be able to use. There can be several rooms. They should be ordered from highest to lowest likeness. Each is defined by:
#                     RoomName(string) likeness(uint) efficiency(double)
#                     A room not listed or listed with efficiency 0 = the creature never works there.
#                     The likeness defines if a creature will go to this kind of room (if available). If likeness = 0 the creature won't go to this given room by itself
#                     The efficiency defines how efficient the creature will be when working in the given room. If efficiency <= 0, the creature won't be able to work in the given room
#                     If likeness > 0 and efficiency <= 0, the creature will go to the given room (by itself or by being dropped) and will wander there
#                     If likeness = 0 and efficiency > 0, the creature won't go to the given room by itself to work but it will use it if dropped by the keeper
#                     Every type has an explicit Casino, Arena and Tavern line (a missing value is written as a 0 line). The Tavern line has the likeness of the
#                     Casino line of the type and efficiency 1.0; a type without any room affinity (the workers and the Champion) has likeness 0 and
#                     efficiency 0 for the three rooms, so it never goes there and cannot use them. A type without a Hunger line in [MoodModifiers]
#                     has no thirst either (no hunger, no thirst): ThirstGrowth/Turn 0, no Thirst mood line and the line "Tavern 0 0" (the Skeleton
#                     keeps its Casino and Arena lines).
# XP                  Defines the XP table needed to level up (up to level 30) between XP tags
#                     Default tables distribute each species' total budget over an increasing cost curve.
# CreatureSkills      Defines the skills (support or attack) that a creature can use. Note that the order matters as the creature will try to use
#                     the skills in the order they are in the definition
# CreatureBehaviours  Allows to customize the creature behaviour by adding plugins. Note that the order matters as the creature will process
#                     the behaviours in the order they are in the definition

