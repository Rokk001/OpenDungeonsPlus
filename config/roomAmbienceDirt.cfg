# Dirt on the floor: flat decals in three stages on every dirty floor tile, flies over very dirty tiles and over piles.
# Client side only, nothing here changes the game. Format and keys: see config/roomAmbience.cfg. Keys used here:
#   DirtStage n     tiles: only shown while the dirt stage (1 stains, 2 litter, 3 layer of filth) the server told for the tile is n
#   DirtStageMin n  tiles: only shown while that dirt stage is at least n
#   Unlimited yes   not counted against MaxParticles (flat decals); the distance limit still applies
# The stage of a tile comes from its own dirt value with the limits DirtStage2At and DirtStage3At of global.cfg [Dirt]; a clean tile
# shows nothing. The tile visuals below are the floors that can carry dirt (claimed ground and the rooms); a name that this build
# does not have is skipped quietly.

[RoomAmbience]
    [Effects]
        ##### Floor decals #####

        [Effect]
            Name        DirtStage1
            Target      Tile
            Match       claimedGround dungeonTempleRoom dormitoryRoom treasuryRoom portalRoom workshopRoom trainingHallRoom libraryRoom hatcheryRoom cryptRoom portalWaveRoom prisonRoom arenaRoom casinoRoom tortureRoom guardRoom templeRoom toiletRoom
            When        Always
            Kind        Model
            Mesh        DirtStage1.mesh
            DirtStage   1
            Offset      0 0 0.02
            Unlimited   yes
            MaxDistance 22
            Priority    1
            Reduced     yes
        [/Effect]

        [Effect]
            Name        DirtStage2
            Target      Tile
            Match       claimedGround dungeonTempleRoom dormitoryRoom treasuryRoom portalRoom workshopRoom trainingHallRoom libraryRoom hatcheryRoom cryptRoom portalWaveRoom prisonRoom arenaRoom casinoRoom tortureRoom guardRoom templeRoom toiletRoom
            When        Always
            Kind        Model
            Mesh        DirtStage2.mesh
            DirtStage   2
            Offset      0 0 0.02
            Unlimited   yes
            MaxDistance 22
            Priority    1
            Reduced     yes
        [/Effect]

        [Effect]
            Name        DirtStage3
            Target      Tile
            Match       claimedGround dungeonTempleRoom dormitoryRoom treasuryRoom portalRoom workshopRoom trainingHallRoom libraryRoom hatcheryRoom cryptRoom portalWaveRoom prisonRoom arenaRoom casinoRoom tortureRoom guardRoom templeRoom toiletRoom
            When        Always
            Kind        Model
            Mesh        DirtStage3.mesh
            DirtStage   3
            Offset      0 0 0.02
            Unlimited   yes
            MaxDistance 22
            Priority    1
            Reduced     yes
        [/Effect]

        ##### Flies #####

        # Over a filthy tile (stage 3), not on every tile
        [Effect]
            Name        DirtFliesFilth
            Target      Tile
            Match       claimedGround dungeonTempleRoom dormitoryRoom treasuryRoom portalRoom workshopRoom trainingHallRoom libraryRoom hatcheryRoom cryptRoom portalWaveRoom prisonRoom arenaRoom casinoRoom tortureRoom guardRoom templeRoom toiletRoom
            When        Always
            Kind        Particle
            System      DirtFlies
            DirtStageMin 3
            Spacing     3
            MaxDistance 14
            Priority    2
        [/Effect]

        # Over every pile (the blood stain has none)
        [Effect]
            Name        DirtFliesPile
            Target      Object
            Match       Pile_*
            When        Always
            Kind        Particle
            System      DirtFlies
            MaxDistance 14
            Priority    2
            Reduced     yes
        [/Effect]
    [/Effects]
[/RoomAmbience]
