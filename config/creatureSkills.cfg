# Creature skill trees, tier 4 skills and templates.
# Read by the ConfigManager (CreatureSkillTree::SkillTreeConfig). One key per line, "Key value..." separated by
# whitespace, '#' starts a comment. A block ends with its closing tag. A '-' in a cell means: not used.
#
# [Skill] ... [/Skill]   one skill of a path of a skill group or a skill family (tier 1 to 3, ranks 1 to 5)
#   Id         config id of the skill (e.g. BLK_C3), unique
#   Name       display name (rest of the line)
#   Kind       one token: PASSIVE_<stat> (stat: dmg%, spell%, alldmg%, hp%, crit, cd%, avoid, ar%, dr%, dig%, claim%,
#              carry%, move%, wake%, manacost%), BUFF_SELF_StrengthChange, BUFF_SELF_SpeedChange, BUFF_SELF_Defense,
#              AURA_ALLY_StrengthChange, DEBUFF_Weak, DEBUFF_Slow, EXPLOSION, HAILSTORM, GASCLOUD, GRENADE,
#              GUIDEDBOLT, WHIRLWIND, FREEZE, INVISIBLE, TELEPORT, DRAIN, RAISEDEAD, SKELARMY, STRIKE, HEAL_SELF,
#              HEAL_ALLY, HEAL_AREA
#   Group      skill group of the creature (blocker, blitzer, flanker, archer, caster, worker); a family skill has
#              a Family line instead
#   Family     skill family (greenskin, dwarf, undead, vermin, tentacle, demon, elf, human, arcane, dragonkin, wild,
#              workfolk); a group skill has a Group line instead
#   Path       name of the path (rest of the line); three tiers of one path form a path
#   Tier       1, 2 or 3 (tier 2 needs 1 rank in tier 1, tier 3 needs 2 ranks in tier 2 of the same path)
#   Values     the value of rank 1 to 5, five tokens; WHIRLWIND uses "push/stun" tokens
#   Mana       the mana cost of rank 1 to 5, five numbers, or '-'
#   Cooldown   cooldown in turns, or '-'
#   Duration   duration in turns (the duration column of the base line for damage skills), or '-'
#   Radius     radius in tiles (AURA_ALLY and HEAL_AREA skills and the radius column of a base line), or '-'
#   Range      range in tiles (debuffs, HEAL_ALLY and the range column of a base line), or '-'
#   BaseLine   the full skill line the skill scales ("ClassName cooldown warmup ..." as in the old skill lists), or '-'.
#              Kinds that scale a damage or control line (EXPLOSION, HAILSTORM, GASCLOUD, GRENADE, GUIDEDBOLT,
#              WHIRLWIND, FREEZE, INVISIBLE, TELEPORT, DRAIN, RAISEDEAD, SKELARMY) need a base line. The rank value
#              multiplies the damage values (min and max) of EXPLOSION, HAILSTORM, GASCLOUD, GRENADE and
#              GUIDEDBOLT lines and the duration of FREEZE; for every other kind it replaces the strength value
#              of the line. For buffs, debuffs, heals and the new kinds a base line is optional and only supplies the
#              warmup of the line; without it the warmup is 0.
#   Skill kinds that heal (HEAL_SELF, HEAL_ALLY, HEAL_AREA): the value is a percent of the own MinHP times the
#   damage multiplier of the Mana attribute level.
#   The mana cost of a rank is paid when the skill starts; manacost% passives reduce it.
#
# [TierFour] ... [/TierFour]   the single skill of a creature type (rank 1, costs 1 point, needs 20 points spent)
#   Creature   the creature type (class name); its skill id is T4_<Creature>
#   Name, Kind, Cooldown, Duration, Mana, Radius, Range, BaseLine   as in [Skill]
#   Value      the value (a number, or "push/stun" for WHIRLWIND)
#
# [Template] ... [/Template]   a point order of a skill group; every group has three templates
#   Group        the skill group
#   Index        1, 2 or 3 (the 0-based index of the template is this number minus 1)
#   Name         display name (rest of the line)
#   Primary      the name of the path that gets the first 15 points (rest of the line)
#   Alternative  the name of the path that points deviating from the template go to (rest of the line)
#
# Settings in global.cfg: SkillPointFirstLevel, SkillRanksPerSkill, SkillTemplateDeviationPercent, SkillRespecChickens,
# SkillRespecWindowSeconds, SkillSpellReferenceMinHP, SkillHealSelfBelow, SkillHealAllyBelow, SkillHealAreaBelow,
# SkillHealAreaMinCreatures. The per-type keys SkillGroup, SkillFamily, PreSkill and TierFourSkill are in creatures.cfg.
