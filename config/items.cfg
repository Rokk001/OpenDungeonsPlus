# Item definition file.
# [ItemDefinitions] holds [Item] blocks. Fields of an [Item]:
#   Id            unique id (also the 2D image base name gui/items/<Id>_<quality>.png)
#   Slot          weapon | shield | head | armour | boots | ring
#   Path          skill path the line is made for (group paths and family paths)
#   Group         blocker | blitzer | flanker | archer | caster | worker | family (family = the path is a family path)
#   WeaponClass   equipments.cfg WeaponType (weapon and shield lines; none otherwise). A creature only equips a weapon
#                 line whose WeaponClass equals the WeaponType of its spawn weapon (WeaponSpawnR / WeaponSpawnL).
#   PoorEquipment equipments.cfg Name whose mesh, Hands and base damage the line uses (weapon and shield lines)
#   [Quality]     one block per quality the line exists in: Name, Display (shown name), LevelMin, Price,
#                 BonusCount min max (number of Bonus lines taken, in order, first = primary), Bonus <Kind> <min> <max>
#                 (value rolled uniformly in [min, max], one decimal, at item creation), Effect <EffectId> <value>.
#                 Common: Price = fixed price. Rare and Epic: Price <base> <per bonus> = base + per bonus x BonusCount rolled.
# Bonus kinds: Damage% = damage of the attack lines and skills (dmg% for melee and weapon missiles, spell% for casters: the item key is one, the game applies it to the wearer kind); MaxHP% = max HP (hp% passive); CritChance = critical chance points; Defense% = all three channel defenses x (1 + v/100); AttackRating% = attack rating (ar% passive); DefenseRating% = defense rating (dr% passive); MoveSpeed% = all move speeds (move% passive); Avoid = avoidance points (avoid passive); Cooldown% = attack-line cooldown (cd% passive); DamageAttribute = level-equivalents of the wearer's damage attribute (Dexterity for archer and caster groups, Strength otherwise); Life = level-equivalents of Life; Mana = level-equivalents of Mana; ManaCost% = mana costs (manacost% passive); Wakefulness% = wakefulness loss (wake% passive); Dig% = dig rate and step gold (dig% passive); Claim% = claim rate (claim% passive); Carry% = gold capacity (carry% passive)
# Level-equivalents: an attribute bonus v adds v x the wearer group's points per level of that attribute to A(L)
#   so LA rises by v for every wearer; a group with 0 points per level of that attribute gets nothing.
# Quality colours: Poor grey, Common white, Rare blue, Epic purple (frame of the 2D image, tint of the 3D model).
# Poor items: the five POOR_* lines (no bonuses) and the Poor weapons of equipments.cfg (WeaponSpawnR/L of creatures.cfg).
