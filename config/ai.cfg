# Keeper AI configuration: the values of the five AI levels and of the AI decisions.
# The game has compiled defaults equal to this file; they are used when the file is missing.
# Every key is documented here, one line each:
#   Key (unit, default): text            single-value keys
#   Key (unit, defaults e/m/n/h/hell): text   five-value keys
# ClickBudgetPerMinute: own value (no outside source is copied)
#
# Section KeeperAILevels: key then five values in the order easy medium normal hard hell.
#   Rho (cycles per minute, defaults 12/15/20/25.433/30): perception-action cycles per minute (alert noticed at the next cycle)
#   Pi (probability, defaults 0.4/0.55/0.75/0.909/0.99): chance that an alert is noticed within the next cycle (else at the next scan)
#   ScanPeriod (seconds, defaults 120/80/45/24.834/10): mean scan period S for everything that is not an alert
#   ClickShare (share, defaults 0.3/0.42/0.6/0.806/1.0): share of ClickBudgetPerMinute the level may use (rolling minute)
#   MistakeMultiplier (factor, defaults 4.555556/3.444444/2.333333/1.944444/0.555556): multiplier kappa on the base mistake rates of the class table
#   EstimateNoise (ln units, defaults 0.206/0.164/0.132/0.106/0.049): log-noise sigma of one sighting of the enemy
#   TacticTemperature (ln units, defaults 2.0/0.7/0.45/0.4/0.35): tactic temperature; higher = closer to the prior
#   AttackAdvantage (ln units, defaults -1.2/-1.15/-1.1/-1.05/-1.0): log advantage wanted before attacking; subtracted in every adv(); negative because the planner assumes the enemy mana and spells like its own
#   FocusFire (probability, defaults 0.62/0.698/0.758/0.807/0.914): chance that a spell or banner goes to the weakest enemy
#   RetreatThreshold (ratio, defaults 0.603/0.661/0.706/0.743/0.823): retreat when own power < threshold x defender power
#   TunnelDetour (factor, defaults 0.215/0.176/0.146/0.122/0.068): median extra tunnel length over the straight line
#   TacticPriorAllin (share (the five sum to 1.00), defaults 0.34/0.33/0.32/0.31/0.3): design prior of tactic allin
#   TacticPriorSingle (share (the five sum to 1.00), defaults 0.58/0.465/0.35/0.23/0.12): design prior of tactic single
#   TacticPriorSplit (share (the five sum to 1.00), defaults 0.04/0.12/0.2/0.25/0.3): design prior of tactic split
#   TacticPriorRaid (share (the five sum to 1.00), defaults 0.01/0.015/0.02/0.025/0.03): design prior of tactic raid
#   TacticPriorCounter (share (the five sum to 1.00), defaults 0.03/0.07/0.11/0.185/0.25): design prior of tactic counter
#   EnemyManaEstimate (mode, defaults own/own/own/own/observed): how the war planner estimates the enemy mana: own = own current mana x the sighting noise; observed = estimated from the game time and the enemy casts seen
#
# Section KeeperAI: key then one value.
#   AiPollSeconds (seconds, default 1): polled events are evaluated at most once per this many seconds in BaseAI::doTurn; a new edge then starts the reaction delay of its row
#   LookPeriod600 (seconds, default 600): look period of one payday cycle: mean look interval = value x ScanPeriod / ReferenceScanPeriod
#   ClickBudgetPerMinute (clicks per rolling minute, default 202.5): click budget at share 1 (own value, no outside source is copied)
#   ClickMinGap (seconds, default 0.296): minimum time between the end of one click action and the start of the next click
#   ClickWindowSeconds (seconds, default 60): length of the rolling window of the click budget
#   ActionLatencyMean (seconds, default 0.72): mean of the lognormal action latency added to every reaction delay
#   ActionLatencySd (seconds, default 0.217): standard deviation of the action latency
#   PeriodicMinDelay (seconds, default 5): lower bound of a periodic look interval
#   SymptomScanFactor (factor, default 0.5): symptom delay = Exp(mean ScanPeriod) x SymptomScanFactor x (2 - Pi)  (= scan x (0.5 + 0.5 x (1 - Pi)))
#   ReferenceScanPeriod (seconds, default 60): scan period S of the reference human; scales every fixed "P N s" and the payday look
#   LookPeriod60 (seconds, default 60): "P 60 s": same scaling
#   LookPeriod120 (seconds, default 120): "P 120 s": same scaling
#   LookFactorBuild (factor, default 0.35): look at the build menu / room list: mean = factor x ScanPeriod
#   LookFactorDormitory (factor, default 0.25): notice of a bed shortage ahead of the symptom
#   LookFactorTrap (factor, default 0.5): look at traps and doors
#   LookFactorSummon (factor, default 0.7): look at the worker count
#   LookFactorPlan (factor, default 2): plans, mood patrol, slap check, next war plan
#   LookFactorScan (factor, default 1): look with no factor ("P look", "P S", "P S x 1")
#   FirstPlanSeconds (seconds, default 600): first war plan step of a keeper
#   FirstPlanJitterSeconds (seconds, default 120): random addition (uniform 0..value) to FirstPlanSeconds
#   FightOverSeconds (seconds, default 10): a fight is over when no fight event arrived for this long (equals Player.cpp:55 BATTLE_TIME_COUNT, which is not readable from outside Player.cpp)
#   MistakeBaseRoutine (probability, default 0.02): base rate class routine
#   MistakeBaseRule (probability, default 0.09): base rate class rule
#   MistakeBaseComplex (probability, default 0.16): base rate class complex
#   MistakeBaseUnfamiliar (probability, default 0.26): base rate class unfamiliar
#   MistakeBaseRare (probability, default 0.55): base rate class rare
#   MistakeMin (probability, default 0.004): lower clip of every mistake probability
#   MistakeMax (probability, default 0.85): upper clip of every mistake probability
#   MistakeTilesDormitory (tiles, default 9): tiles of the first dormitory when the build mistake is taken (instead of the RoomPlan size)
#   MistakeTilesHatchery (tiles, default 9): tiles of the first hatchery when the build mistake is taken
#   MistakeTrapWantDivisor (divisor, default 2): trap tiles wanted are divided by this (at least 1) when the F01 mistake is taken; drawn once per game
#   ReserveSlipStartMin (share of TimePayDay, default 0.2): mistake A04: the wage reserve is ignored from this share of TimePayDay after a payday
#   ReserveSlipStartMax (share of TimePayDay, default 0.9): upper end of the uniform draw above (the slip then lasts until the next payday)
#   RestHpShareSlip (HP share, default 0.3): mistake J08: the group is rested when its HP share is at least this (instead of RestHpShare)
#   DigWorkersSlip (workers, default 1): mistake I01: diggers sent when the mistake is taken (instead of AttackDiggers)
#   EarlyDigMultiplier (factor, default 0.3): row multiplier of the mistake "starts the tunnel early, without defence" (class rule)
#   SlapMistakePauseSeconds (seconds, default 120): after a slap-for-production check the next check is at least this much later (plus a look of LookFactorPlan)
#   SlapMistakeBaseSeconds (seconds, default 60): duration of a slap-for-production episode = SlapMistakeDelayFactor x symptom delay + this
#   SlapMistakeDelayFactor (factor, default 2): factor on the symptom delay in the episode duration
#   SlapMistakeInterval1 (seconds, default 60): slap interval per creature during an episode of the D04 mistake; one of five values drawn with equal chance
#   SlapMistakeInterval2 (seconds, default 90): slap interval per creature during an episode of the D04 mistake; one of five values drawn with equal chance
#   SlapMistakeInterval3 (seconds, default 120): slap interval per creature during an episode of the D04 mistake; one of five values drawn with equal chance
#   SlapMistakeInterval4 (seconds, default 180): slap interval per creature during an episode of the D04 mistake; one of five values drawn with equal chance
#   SlapMistakeInterval5 (seconds, default 300): slap interval per creature during an episode of the D04 mistake; one of five values drawn with equal chance
#   MinerShareEarly (share, default 0.6): share of workers that should be mining until MinerShareSwitchMinute
#   MinerShareLate (share, default 0.35): share of workers that should be mining afterwards
#   MinerShareSwitchMinute (minutes, default 10): minute at which the mining share switches
#   MarkedTilesPerWorker (tiles, default 1): marked-for-digging tiles kept in stock per intended miner (the share itself cannot be commanded, 40/40/20 split Player.cpp:1238-1304)
#   SummonManaFactor (factor, default 2): A03: summon when mana > factor x price of the next worker
#   SummonIncomeMin (mana per second, default 40): A03: and the mana income is above this
#   SummonWorkersMax (workers, default 10): A03: up to this many workers
#   WalletReserveWindow (seconds, default 60): A04: the reserve slip never starts later than this many seconds before the payday: slip start = min(U(ReserveSlipStartMin, ReserveSlipStartMax) x TimePayDay, TimePayDay - WalletReserveWindow)
#   CreateGoldManaReserve (share of max mana, default 0.25): A05: cast Create Gold only while mana >= price + this share of MaxManaPerSeat
#   GoldShareBuild (share of capacity, default 0.85): A06: build treasury tiles or spend when gold exceeds this share of the capacity (SeatData::getGoldMax)
#   ManaShareSpend (share of max mana, default 0.9): A07: spend mana on Create Gold, Heal, Summon Worker or attack spells above this share of MaxManaPerSeat
#   GoldShareTreasury2 (share of capacity, default 0.7): A09: build the second treasury when gold exceeds this share of the capacity
#   RoomGoldMargin (gold, default 300): B01 and every other purchase: gold >= cost + margin + wage bill
#   BedsSpare (beds, default 1): B02: beds wanted = creatures + this; the next dormitory is ordered when creatures >= beds - this
#   DormitoryExtensionTiles (tiles, default 25): tiles of every dormitory added after the first
#   HatcheryExtensionMinTiles (tiles, default 9): smallest hatchery extension
#   HatcheryExtensionMaxTiles (tiles, default 25): largest hatchery extension
#   HatcheryTilesPerCreature (tiles, default 1): hatchery tiles wanted per creature (food cover = tiles / creatures)
#   TavernKeeperPaysFactor (factor, default 2): B08: the keeper pays the beer only while treasury > factor x wage bill
#   MerchantMarginMin (percent, default 10): B11: lowest margin
#   MerchantMarginMax (percent, default 20): B11: highest margin
#   LabModeDefault (mode, default 1): B13: alchemy lab mode (0 all, 1 only heal and mana potions, 2 all but heal/mana/full restore/end freeze; RoomAlchemyLab.cpp:227-231)
#   InfirmaryDischargePercent (percent, default 100): B16: infirmary discharge threshold (game range 40..100 step 10)
#   GhostResearchShare (share of entries, default 0.7): B17: product research points while less than this share of the research entries is researched
#   GhostManaShare (share of max mana, default 0.2): B17: product mana when mana < this share of MaxManaPerSeat
#   ReviveManaFactor (factor, default 2): B17: revive an own body when mana > factor x revive price
#   BridgeMinShortcutTiles (tiles, default 10): B21: build a bridge only if the route over water or lava is shorter by more than this
#   PlacementPointsPerWallSpot (points, default 50): room placement score per active wall spot (moved from BaseAI.cpp:36); read by BaseAI::findBestPlaceForRoom/computePointsForRoom
#   PlacementHandicapPerTileOffset (points, default 20): room placement handicap per tile of offset (moved from BaseAI.cpp:37); read as above
#   PlacementFirstSpotTiles (tiles, default 3): consecutive wall tiles for the first active spot (BaseAI.cpp:300-405); read as above
#   PlacementNextSpotTiles (tiles, default 2): consecutive wall tiles for every further active spot; read as above
#   ResearchQueueEntries (entries, default 2): C02: entries queued per look of the research window
#   PossessLeaveHpShare (HP share, default 0.3): D05: leave the possessed creature when its HP is below this share of its max HP
#   HealBelow (HP share, default 0.5): E02: heal the own creature with the lowest HP share when it is below this
#   HealNeverAbove (HP share, default 0.7): E02: never heal a creature above this share
#   HealCastChance (probability, default 0.4): E19: when a creature is hurt and a damage spell exists the heal is chosen with this chance
#   HasteFightSeconds (seconds, default 20): E03: also cast Haste on the main group when a fight lasts longer than this
#   EyeCastIntervalMinutes (minutes, default 5): E04: at most one Eye of Evil per this many minutes
#   TremorMinTargets (creatures, default 4): E15: Tremor only against at least this many intruders standing together
#   InfernoReserveCasts (casts, default 2): E16: keep the mana of this many casts before the first expected attack; C06: the casts in the Inferno income test
#   LightningManaReserve (share of max mana, default 0.05): E09: cast Lightning only while mana > price + this share of MaxManaPerSeat
#   SpellManaReserve (share of max mana, default 0.05): E19: keep this share of MaxManaPerSeat in every fight
#   CastRecheckSeconds (seconds, default 5): E19: when no spell can be cast the fight loop looks again after this
#   MinRecastSeconds (seconds, default 3): E19: after a cast the next cast is at the later of the action end and this many seconds
#   CallToWarMinCreatures (creatures, default 3): E07/J02: the defence rally uses Call to War only when MORE than this many creatures are to be gathered; the launch of an assault always uses banners
#   TrapTilesPerEntrance (tiles, default 3): F01 F15: trap tiles per entrance (the tunnel counts as an entrance)
#   GasEveryNthTile (tiles, default 3): F04: every n-th trap tile is gas (tile index % n == n - 1), the others alternate cannon (odd) and spike (even)
#   TrapGoldMargin (gold, default 300): F12: while an own trap tile is exhausted (after the F12 reaction to FightOver), every purchase keeps this much gold free on top of cost + RoomGoldMargin + wage bill; the reload itself is done by the workers
#   CannonManaPerTile (mana, default 2500): F03: keep this much mana per cannon tile
#   SpikeBehindDoorMinTiles (tiles, default 3): F02: spike traps start this many tiles behind the door
#   SpikeBehindDoorMaxTiles (tiles, default 6): F02: and end this many tiles behind the door
#   CannonMaxDoorDistance (tiles, default 15): F03: cannons within this many tiles of the door; also the radius around the breakthrough tile in which revealed enemy trap tiles count as the entrance gauntlet, and the distance from every entrance beyond which a trap counts as obsolete (A08)
#   BoulderCorridorMinTiles (tiles, default 8): F05: boulder only in a straight corridor of at least this length
#   AlarmDistanceTiles (tiles, default 6): F09: alarm trap this many tiles outside each entrance
#   MaxWaitingForCraft (traps, default 2): do not queue more than this many unfinished traps or doors in the workshops
#   TrapPlanMinRooms (rooms, default 9): F01: traps and doors are planned only when a workshop exists and at least this many rooms are built
#   PrisonWaitMinutes (minutes, default 5): G02: torture a prisoner after this many minutes in prison
#   ExploreTunnelsPerDirection (tunnels, default 1): I05: exploration tunnels marked per direction
#   Leveltilesdig (rings, default 2): rings of known diggable tiles marked around a known seam; read by ECON::digQueueWatch (A01) and AiKnowledge::exploreTunnels (I05, a seam found by an exploration tunnel)
#   HeartDefenceAreaTiles (tiles, default 5): half-width of the square around the own heart tile inside which a fleeing own creature is not picked up; read by WAR::restAfterFight (J08)
#   AttackMinMinute (minutes, default 20): I01: earliest minute of a planned tunnel
#   AttackMinFighters (creatures, default 5): I01: fighters needed
#   AttackMinTrapTiles (tiles, default 2): I01: trap tiles needed (or a door)
#   AttackDiggers (workers, default 3): I01: workers digging the tunnel
#   EarlyDigMinute (minutes, default 12): I01 mistake: earliest minute of an early tunnel
#   EarlyDigMinFighters (creatures, default 3): I01 mistake: fighters needed for the early tunnel
#   DiggerCapShare (share of workers, default 0.5): I01: diggers never exceed this share of the workers (at least 1)
#   DigActions (actions, default 4): I01: dig drags used to mark the tunnel route
#   DetourSigma (ln units, default 0.5): I02: spread of the lognormal detour draw (median TunnelDetour)
#   TunnelProbeSeconds (seconds, default 5): F15: interval of the path probe that detects an opened tunnel
#   EnemyOutMinCreatures (creatures, default 3): J07: enemy counts as out when at least this many of its fighters are in sight on the AI seat's claimed tiles
#   SecondWaveMinutes (minutes, default 1): K08: attack again within this time when the enemy traps are empty
#   HeartPossessBelow (HP share, default 0.6): J05: possess the strongest creature when the heart is below this share of its max HP
#   RestHpShare (HP share, default 0.8): K01 J08: a creature is ready for an attack when its HP share is at least this
#   AttackMinReady (creatures, default 3): K01: no plan when fewer creatures are ready
#   RestSecondsAfterAssault (seconds, default 45): K10: no new plan for this long after an assault ended
#   RaidGoldThreshold (gold, default 8000): K04: enemy gold above this makes treasury 2 / treasury / library the raid targets
#   RetreatCheckSeconds (seconds, default 5): K07: the retreat test runs this often during an assault
#   ContactTimeoutSeconds (seconds, default 1800): K07: an assault that lasts longer than this after contact is ended
#   ScoutCameraActions (actions, default 2): I03: camera actions charged per observation of the enemy
#   ReloadRetrySeconds (seconds, default 30): F12: while the reload reserve is kept, the exhausted state of the own trap tiles (Trap::isTileExhausted) is re-tested this often
#   PoorDefenceShuffleChance (probability, default 0.5): J03 mistake (poor defence): chance that the order of the defenders is shuffled
#   ChampionExtraSeconds (seconds, default 30): E20: cast Summon Champion only while mana >= SummonChampionPrice + SummonChampionDrainPerSecond x this (the free period price / drain = 48 s is already paid by the price; this is the extra upkeep the AI wants to be able to pay)
#   GroupShareMain (share of ready army, default 0.55): K03: main group = the strongest share of the ready creatures (split tactic)
#   GroupShareRaid (share of ready army, default 0.3): K03: raid group = the next share (split tactic: ready[0.55n .. 0.85n])
#   GroupShareSingle (share of ready army, default 0.7): tactic single: the strongest share of the ready creatures
#   GroupShareRaidTactic (share of ready army, default 0.4): tactic raid: the strongest share of the ready creatures
#   CounterArmyShare (share of ready army, default 0.85): J07 tactic counter: the strongest share of the ready creatures
#   RaidTargetsSplit (targets, default 2): number of raid targets of the raid group of tactic split (first entries of the raid target list)
#   RaidTargetsRaid (targets, default 3): number of raid targets of tactic raid
#   RawHitFactor (probability, default 0.9): hit chance used in the raw damage per second against an undefended target
#   StrengthRatioCap (ratio, default 3): z = min(cap, enemy power / own power)
#   ScorePenaltyBase (factor, default 0.6): common factor of the z penalty of every tactic
#   ScorePenaltyAllin (factor, default 1.0): shape factor of tactic allin
#   ScorePenaltySingle (factor, default 0.49): shape factor of tactic single
#   ScorePenaltySplit (factor, default 0.72): shape factor of tactic split
#   ScorePenaltyRaid (factor, default 0.16): shape factor of tactic raid
#   ScorePenaltyCounter (factor, default 0.72): shape factor of tactic counter
#   ScorePenaltyCounterFactor (factor, default 0.3): extra factor of tactic counter
#   BonusSplit (log units, default 0.2): log bonus of tactic split
#   BonusRaidBase (log units, default 1.0): constant part of the raid bonus
#   BonusRaidGold (factor, default 0.4): coefficient of ln(1 + gold estimate / BonusRaidGoldDivisor) in the raid bonus
#   BonusRaidGoldDivisor (gold, default 3000): gold unit of the raid bonus
#   BonusCounter (log units, default 0.7): log bonus of tactic counter
#   WaitWeight (weight, default 1.0): weight of the option "wait" in the draw
#   TacticExponentClamp (log units, default 30): the exponent score / TacticTemperature is clamped to +-this
#   AdvFloor (log units, default -4): advantage returned when the own group would be wiped out by traps and spells before the fight
#   AdvHpFloorShare (share, default 0.1): that case: own HP after traps and spells <= this share of the group HP
#   EnemyHpFloorShare (share, default 0.05): enemy HP after own spells is at least this share of its estimated HP
#   FightEstimateDamageShare (share, default 0.88): share of the group damage that reaches the heart or the room (estimate of the fight length)
#   EstimateSetupSeconds (seconds, default 5): seconds added to the estimated fight length (door open to first blow)
#   EstimateRoomTiles (tiles, default 16): tiles of an economy room assumed in the length of a raid fight
#   EstimateTileHp (HP, default 10): hit points of one room tile assumed in that estimate (the game rooms have 30-50, rooms.cfg)
#   HeartHealMargin (HP per second, default 1.0): the heart is attackable in the estimate only if group damage > heart heal + this
#   HeartBreakFallbackSeconds (seconds, default 600): estimated fight length when the group cannot out-damage the heart heal
#   DoorTimeCap (seconds, default 60): estimated time to break a door is at most this
#   PotentialCastsMax (casts, default 40): spell potential: at most this many casts per fight
#   PotentialCastPeriod (seconds, default 4.5): spell potential: one cast per this many seconds of estimated fight length
#   PotentialCastsBase (casts, default 1): spell potential: casts = floor(base + T / PotentialCastPeriod)
#   SpellPotentialEff (share, default 0.7): share of the nominal spell damage that is counted
#   TrapEff (share, default 0.45): share of the nominal trap damage that is counted (measured realisation)
#   TrapPassSeconds (seconds, default 4): seconds the attackers need to pass the trap tiles once the door is open
#   TrapTargetsSpike (creatures, default 1): expected targets per shot of a spike trap
#   TrapTargetsCannon (creatures, default 1): expected targets per shot of a cannon
#   TrapTargetsBoulder (creatures, default 2): expected targets per shot of a boulder trap
#   TrapTargetsGas (creatures, default 2): expected targets per shot of a gas trap
#   TrapTargetsLightning (creatures, default 1): expected targets per shot of a lightning trap
#   TrapTargetsFireburst (creatures, default 2): expected targets per shot of a fireburst trap
#   SpellTargetsLightning (creatures, default 1): targets per cast
#   SpellTargetsExplosion (creatures, default 1): targets per cast
#   SpellTargetsTremor (creatures, default 4): targets per cast
#   SpellTargetsInferno (creatures, default 2): targets per cast
#   EstimateNoSightingNoise (ln units, default 0.6): no sighting yet: own hp and dps are multiplied by exp(N(0, this))
#   EstimateGoldDefault (gold, default 5000): enemy gold when it was never seen (also used as the unreadable enemy gold)
#   EstimateReadyFlipRate (factor, default 0.08): the "traps loaded" flag flips with probability EstimateNoise x this
#
# Section RoomPlan: one line per room in build order: name, tiles.
# Section Actions: one line per hand action: name, clicks, seconds.
# Section RowClasses: one line per AI decision: id, mistake class, multiplier (0 = hard limit, no mistake roll).

