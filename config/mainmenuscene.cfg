# Firelight amplitude, angular frequency (radians/second) and independent phase (radians).
# factor = 1 + amplitude * (0.7*sin(frequency*t+phase) + 0.3*sin(2.37*frequency*t+1.73*phase)).
[MenuFireLights]
Flicker LeftFire 0.18 7.1 0
Flicker RightFire 0.16 8.3 1.2
Flicker GateFire 0.12 6.7 2.3
Flicker CrownFire 0.10 8.1 1.1
Flicker LeftGateFire 0.16 8.7 0.7
Flicker RightGateFire 0.18 7.7 2.8
Flicker HallFire 0.10 5.9 1.8
[/MenuFireLights]
