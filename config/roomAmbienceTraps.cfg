# Room ambience of the trap types and door types that share a mesh with another type.
# Format and keys: see config/roomAmbience.cfg. "trap:<type>" in Match is the type of the trap or door
# (Spike, Alarm, Fear, Gas, Lightning, Fireburst, Freeze, WatchBanner, Trigger, DoorWooden, DoorIronbound,
# DoorSteel, DoorBarricade, DoorSecret, DoorRuned). The client has no message for "a trap went off", so
# the active look runs while a creature is close to the trap ("When Occupied"). Purely cosmetic.

[RoomAmbience]
    [Effects]
        ##### Alarm: a pulsing light, flashing light and rings when someone is close #####

        [Effect]
            Name        AlarmLight
            Target      Object
            Match       trap:Alarm
            When        Always
            Kind        Particle
            System      RoomAmbAlarmLight
            Offset      0 0 0
            MaxDistance 14
            Priority    2
        [/Effect]

        [Effect]
            Name        AlarmFlash
            Target      Event
            Match       Alarm
            Event       TrapFired
            Kind        Particle
            System      RoomAmbAlarmFlash
            Offset      0 0 0
            Duration    2.0
            MaxDistance 16
            Priority    4
            Reduced     yes
        [/Effect]

        [Effect]
            Name        AlarmRings
            Target      Event
            Match       Alarm
            Event       TrapFired
            Kind        Particle
            System      RoomAmbAlarmRing
            Offset      0 0 0
            Duration    2.0
            MaxDistance 16
            Priority    3
        [/Effect]

