# Equipment definition file.
# An equipment can be used on a creature to improve its stats.
# Each Equipment is defined with [EquipmentDefinitions] [/EquipmentDefinitions]
# within a [Equipment] [/Equipment] tag couple.
#
# Supported stats:
# Name             (Must be unique without spaces) The Equipment definition name.
# MeshName         Ogre mesh to be displayed in the .mesh format
#                  "none" means the weapon is already part of the creature model (nothing is attached).
# PhysicalDamage   Maximum physical damage
# PhysicalDamageMin Optional minimum physical damage (default maximum)
# MagicalDamage    Maximum magical damage
# MagicalDamageMin Optional minimum magical damage (default maximum)
# ElementDamage    Maximum element damage
# ElementDamageMin Optional minimum element damage (default maximum)
# AttackRating     Optional attack rating bonus (default 0)
# DefenseRating    Optional defense rating bonus (default 0)
# CooldownNbTurns (Optional, weapons only) Melee cooldown in turns for a creature that carries this weapon.
#                  The larger value of the skill cooldown and both weapon cooldowns counts. Without a weapon the cooldown of the Melee skill in
#                  creatures.cfg applies. Positive whole number. Shields and other non-weapons have no such field and
#                  do not take part in the choice. Ranged skills do not use it. The cooldown shrinks by 0.75 percent per
#                  creature level above 1 when CooldownReductionPerLevel of global.cfg is set (0 = the same cooldown at every level,
#                  not rounded, never below 1 turn).
# ParryBase       (Optional, weapons only) Parry chance in percent of a creature that carries this weapon: base value,
# ParryPerLevel    added per creature level, and ParryMax, the highest chance. With two weapons the larger chance counts.
#                  A weapon without these fields uses ParryBase, ParryPerLevel and ParryMax of global.cfg. Only the
#                  configured creature avoidance kind applies. Shields have no parry fields.
# Strength         Optional attribute bonus (default 0, all 0 for now): added to the Strength of a creature that carries this item. The
# Dexterity         same holds for Dexterity, Life and Mana. The attribute level of the creature (creatures.cfg) rises by
# Life              bonus / points per level of that attribute.
# Mana
# CritChance       Optional critical chance bonus in percent (default 0) for a creature that carries this item.
# PhysicalDefense  Physical defense
# MagicalDefense   Magical defense
# ElementDefense   Elemental defense

# Settings of the item and potion effects (read before the first [Equipment] block of this file):
# BleedTurns                         (double, turns) Turns the bleed effect lasts
# BulwarkRadius                      (double, tiles) Radius of the bulwark item effect
# ChillFactor                        (double, factor) Factor on the move speed of a chilled creature
# DexterityPotionCritLarge           (double, percent) Critical chance a large dexterity potion adds
# DexterityPotionCritMedium          (double, percent) Critical chance a medium dexterity potion adds
# DexterityPotionCritSmall           (double, percent) Critical chance a small dexterity potion adds
# EquipUpgradeMargin                 (double) Margin by which an item must be better for a creature to swap
# HeroDropLargeLevel                 (uint, level) Hero level from which a hero drops large items
# HeroDropMediumLevel                (uint, level) Hero level from which a hero drops medium items
# ItemAuraRadius                     (double, tiles) Radius of the aura effects of items
# LastStandHealthShare               (double, share of max HP 0-1) Share of its max HP below which the last stand effect starts
# LifespringHpShare                  (double, share of max HP 0-1) Share of max HP a lifespring potion heals
# LifespringLowHpShare               (double, share of max HP 0-1) Share of max HP below which a creature drinks a lifespring potion
# LifespringManaShare                (double, share 0-1) Share of max mana a lifespring potion restores
# MaxItemEffects                     (uint, effects) Most effects one item can carry
# MendingSeconds                     (double, seconds) Seconds over which the mending effect heals
# PotionManaDrinkShare               (double, share 0-1) Share of its mana below which a creature drinks a mana potion
# PotionRegenSeconds                 (double, seconds) Seconds a regeneration potion works
# PotionSlotLevel2                   (uint, level) Creature level from which it has a second potion slot
# PotionSlotLevel3                   (uint, level) Creature level from which it has a third potion slot
# SecondWindHealthShare              (double, share of max HP 0-1) Share of max HP the second wind effect restores
# WeakenFactor                       (double, factor) Factor on the damage of a weakened creature
[EquipmentDefinitions]
    BleedTurns	5
    BulwarkRadius	2
    ChillFactor	0.9
    DexterityPotionCritLarge	6
    DexterityPotionCritMedium	4
    DexterityPotionCritSmall	2
    EquipUpgradeMargin	0.5
    HeroDropLargeLevel	20
    HeroDropMediumLevel	10
    ItemAuraRadius	2
    LastStandHealthShare	0.25
    LifespringHpShare	0.5
    LifespringLowHpShare	0.25
    LifespringManaShare	0.25
    MaxItemEffects	2
    MendingSeconds	10
    PotionManaDrinkShare	0.3
    PotionRegenSeconds	10
    PotionSlotLevel2	10
    PotionSlotLevel3	20
    SecondWindHealthShare	0.5
    WeakenFactor	0.95
