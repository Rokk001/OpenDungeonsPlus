# Potion and herb definition file.
# [Potion] fields: Id, Display, Size (Small|Medium|Large|Single), Kind, Value, Duration (seconds, 0 = instant), LevelMin,
#   Herbs (<Herb> <count> pairs consumed when brewing starts), BrewSeconds, Price (merchant base price), Image (gui/potions/<Image>.png).
# Kinds: HealPercent = heals Value % of max HP at once; ManaPercent = refills Value % of max mana; FullRestore = HP and mana to
#   max; EndFreeze = ends a Freeze effect; StrengthChange = CreatureEffectStrengthChange with factor Value for Duration;
#   DexterityChange = attack and defense rating x Value and crit +2/+4/+6 points for Duration; DefenseChange = all three
#   channel defenses x Value for Duration; MaxHPChange = max HP x Value for Duration (current HP scaled with it, scaled
#   back at the end, never below 1); MaxManaChange = max mana x Value for Duration; HealPerTenSeconds = heals Value % of
#   max HP per 10 s for Duration; ManaRegenChange = mana regeneration x Value for Duration.
# All durations and values are doubles (fractions kept).
