    spellPossess	600
    spellCreateGold	600
    # Spells, tier IV
    spellTremor	1500
    spellInferno	1500
    spellDefector	1500
    spellHexenHen	1500
    keeperManaFlow	1500
[/Skills]

[FreeLevelOne]
    roomTreasury
    roomDormitory
    roomHatchery
    roomLibrary
    spellSummonWorker
[/FreeLevelOne]
