# Skills configuration file.
# Skills configurable elements are defined within [Skills] [/Skills]
#
# Supported elements:
# roomArena                         (int)    Points needed for researching room arena
# roomBridgeStone                   (int)    Points needed for researching room stone bridge
# roomBridgeWooden                  (int)    Points needed for researching room wooden bridge
# roomCasino                        (int)    Points needed for researching room casino
# roomCrypt                         (int)    Points needed for researching room crypt
# roomGuardRoom                     (int)    Points needed for researching room guard room
# roomPrison                        (int)    Points needed for researching room prison
# roomTemple                        (int)    Points needed for researching room temple
# roomTorture                       (int)    Points needed for researching room torture
# roomTrainingHall                  (int)    Points needed for researching room training hall
# roomWorkshop                      (int)    Points needed for researching room Workshop
# trapCannon                        (int)    Points needed for researching trap cannon
# trapBoulder                       (int)    Points needed for researching trap boulder
# trapSpike                         (int)    Points needed for researching trap spike
# trapAlarm                         (int)    Points needed for researching trap alarm
# trapFear                          (int)    Points needed for researching trap fear
# trapGas                           (int)    Points needed for researching trap gas
# trapLightning                     (int)    Points needed for researching trap lightning
# trapFireburst                     (int)    Points needed for researching trap fireburst
# trapFreeze                        (int)    Points needed for researching trap freeze
# trapWatchBanner                     (int)    Points needed for researching watch banner
# trapTrigger                       (int)    Points needed for researching trigger trap
# trapDoorWooden                    (int)    Points needed for researching wooden doors
# trapDoorIronbound                    (int)    Points needed for researching ironbound doors
# trapDoorSteel                     (int)    Points needed for researching steel doors
# trapDoorBarricade                 (int)    Points needed for researching barricades
# trapDoorSecret                    (int)    Points needed for researching secret doors
# trapDoorRuned                     (int)    Points needed for researching runed doors
# spellCallToWar                    (int)    Points needed for researching spell call to war
# spellCreatureDefense              (int)    Points needed for researching spell CreatureDefense
# spellCreatureExplosion            (int)    Points needed for researching spell CreatureExplosion
# spellCreatureHaste                (int)    Points needed for researching spell CreatureHaste
# spellCreatureHeal                 (int)    Points needed for researching spell CreatureHeal
# spellCreatureSlow                 (int)    Points needed for researching spell CreatureSlow
# spellCreatureStrength             (int)    Points needed for researching spell CreatureStrength
# spellCreatureWeak                 (int)    Points needed for researching spell CreatureWeak
# spellEyeEvil                      (int)    Points needed for researching spell Eye of evil
# spellCreateGold                   (int)    Points needed for researching spell CreateGold
# spellLightning                    (int)    Points needed for researching spell Lightning
# spellTremor                       (int)    Points needed for researching spell Tremor
# spellDefector                     (int)    Points needed for researching spell Defector
# spellHexenHen                      (int)    Points needed for researching spell Hexen Hen
# spellInferno                      (int)    Points needed for researching spell Inferno
# spellPossess                      (int)    Points needed for researching spell Possess
# spellSummonChampion is not researchable (the campaign Heartstone unlocks it) and has no entry here
# keeperDominion                   (int)    Points needed for researching the keeper skill Dominion
# keeperHeartFortitude             (int)    Points needed for researching the keeper skill Heart Fortitude
# keeperHeartMending               (int)    Points needed for researching the keeper skill Heart Mending
# keeperManaFlow                   (int)    Points needed for researching the keeper skill Mana Flow
# roomTreasury, roomDormitory, roomHatchery, roomLibrary, spellSummonWorker (int)  Points needed for researching the five starting entries
#
# Every value is the level-1 cost of the tier of the entry in the research tree: tier I 100, tier II 250, tier III 600, tier IV 1500.
# Level 2 costs twice and level 3 four times that value. A missing entry is logged as an error and costs 1500.
#
# [FreeLevelOne] ... [/FreeLevelOne]: the skills every seat starts with at level 1 (their level 1 costs no points, levels 2 and 3 cost
# twice and four times the value above). A level may still forbid them in its [SkillNotAllowed] section. They are not applied in sandbox mode.

[Skills]
    # Rooms, tier I
    roomTreasury	100
    roomDormitory	100
    roomHatchery	100
    roomLibrary	100
    # Rooms, tier II
    roomTrainingHall	250
    roomWorkshop	250
    roomBridgeWooden	250
    roomGuardRoom	250
    roomCasino	250
    # Rooms, tier III
    roomArena	600
    roomPrison	600
    roomCrypt	600
    roomBridgeStone	600
    # Rooms, tier IV
    roomTorture	1500
    roomTemple	1500
    keeperDominion	1500
    # Traps and doors, tier I
    trapDoorWooden	100
    trapSpike	100
    trapCannon	100
    trapAlarm	100
    # Traps and doors, tier II
    trapDoorIronbound	250
    trapDoorBarricade	250
    trapGas	250
    trapBoulder	250
    trapWatchBanner	250
    trapFear	250
    # Traps and doors, tier III
    trapDoorSteel	600
    trapDoorSecret	600
    trapLightning	600
    trapTrigger	600
    trapFireburst	600
    # Traps and doors, tier IV
    trapDoorRuned	1500
    trapFreeze	1500
    keeperHeartFortitude	1500
    keeperHeartMending	1500
    # Spells, tier I
    spellSummonWorker	100
    spellCreatureHeal	100
    spellCreatureHaste	100
    spellEyeEvil	100
    # Spells, tier II
    spellCreatureDefense	250
    spellCreatureStrength	250
    spellCallToWar	250
    spellCreatureSlow	250
    spellLightning	250
    # Spells, tier III
    spellCreatureWeak	600
