# Campaign level sequence. Levels are played in this order; a level is
# unlocked when all levels before it are completed.
#
# [Level]       starts a new level entry
# File          level file, relative to the "levels" directory
# Title         name shown in the campaign menu
# Briefing      text shown before the level (\n starts a new line)
# Debriefing    text shown after the level was won
# Map           territory on the campaign map: blocks x,y,width,height in
#               percent of the map, separated by ";". Optional; levels without
#               it are placed on an automatic grid.
# Province      province or bonus site of the level on the world map
#               (gui/campaign/campaign-world.json). Optional.
# Warden        ruler of the province, shown in its tooltip. Optional.
# Difficulty    1 (easy) to 5, shown in the tooltip. Optional.

[Level]
File=campaign/Mossgate.level
Province=T01
Warden=Reeve Tobin Marsh
Difficulty=1
Title=Mossgate
Briefing=Master, the border village of Mossgate sleeps behind a single watch post, and its reeve trusts the moss to keep him hidden.\n\nThe rock around your heart is soft. Dig it out, mine the gold in the walls and claim the meadow cave beyond the gate.\n\nThen follow the cave roads to the village and strike down Reeve Tobin Marsh before he finds the courage to call for help.
Debriefing=The reeve lies silent and Mossgate is yours. The moss will grow over your banners now.

[Level]
File=campaign/Brackenford.level
Province=T02
Warden=Warden Elsa Brack
Difficulty=1
Title=Brackenford
Briefing=My lord, the folk of Brackenford live on both banks of a shallow ford and have more courage than soldiers.\n\nTheir warden has only a handful of heroes to send against you. Lay your first rooms in the fern caves on this bank, claim the grove and let your creatures gather.\n\nWhen the ford is yours, wade across and take her keep in the north-east.
Debriefing=Brack's keep is quiet and the ford runs under your banner. The fern caves belong to you.

[Level]
File=campaign/Coldwell.level
Province=T03
Warden=Warden Hugo Cole
Difficulty=1
Title=Coldwell
Briefing=Master, Coldwell drinks from one old well, and the springs whisper that a block of gold lies beneath it.\n\nTake the plaza, dig out the gold and spend it on an army. Warden Hugo Cole has shut his keep behind doors and cannons, but his watch is thin and his barracks are small.\n\nBreak the north gate and put an end to him.
Debriefing=Warden Cole is dead and the gates of his keep stand open. Coldwell is yours.

[Level]
File=campaign/Tinmoor.level
Province=T04
Warden=Warden Merrin Tay
Difficulty=2
Title=Tinmoor
Briefing=The miners of Tinmoor know every shaft and every seam, my lord, and they guard them fiercely.\n\nYou have little gold, so start with the tin seams and let the metal pay for your first doors and cannons. Warden Merrin Tay waits at the top of the mine behind two watch posts.\n\nSome of the old chambers were sealed long ago. Dig carefully and you may find one that answers to your heart.
Debriefing=Merrin Tay is dead and the seams of Tinmoor are yours to work.

[Level]
File=campaign/Ravensledge.level
Province=T05
Warden=Captain Osric Vane
Difficulty=2
Title=Ravensledge
Briefing=My lord, the fort of Ravensledge stands on three cliff shelves, and only a few bridges cross the chasms between them.\n\nCaptain Osric Vane has put archers on every ledge, so take each shelf slowly and cover your bridgeheads with doors and fear traps.\n\nReach the keep on the highest shelf and put an end to him.
Debriefing=Captain Vane has fallen and the ravens have left the ledge. Ravensledge is yours.

[Level]
File=campaign/Ashcombe.level
Province=T06
Warden=Warden Liesl Ashby
Difficulty=2
Title=Ashcombe
Briefing=Master, the valley of Ashcombe still smokes from an old fire, and Warden Liesl Ashby is making ready to flee over the northern pass.\n\nYou have an army and gold to begin with, but not unlimited time. Cross the ash basin, take what the old mill offers and reach her hold before the wagons roll.\n\nIf she escapes, the valley will rise against you for good.
Debriefing=Liesl Ashby has fallen before her wagons could leave. The ashes of Ashcombe are yours.

[Level]
File=campaign/Greywater.level
Province=T07
Warden=Warden Corwin Gray
Difficulty=2
Title=Greywater
Briefing=Greywater lies on an underground river, master, and its warden trades iron with the dwarves of the deep.\n\nYou have no coin yet, so dig for it first. Across the water another keeper is under siege by the town's heroes; if he falls, they will turn on you.\n\nStrike down Warden Corwin Gray in his river hall, and whatever happens, keep your own heart alive.
Debriefing=Corwin Gray is dead and the river belongs to you. The dwarves will want new terms.

[Level]
File=campaign/Campaign1.level
Map=4,55,20,30;4,40,12,15
Title=Falling Keeper
Briefing=A strong keeper is being attacked by heroes.\n\nKill all your enemies and protect your dungeon heart to gain control of the underground.
Debriefing=The heroes are dead and the keeper next door has fallen. The underground around you is yours.

[Level]
File=campaign/Bonus1.level
Map=26,20,14,16
Title=Hidden Cellar
Bonus=1
Briefing=A hidden cellar lies behind the old dungeon. Few know that it exists.\n\nClear it of its defenders to find a piece of the talisman.
Debriefing=The cellar is cleared and a piece of the talisman is yours.

[Level]
File=campaign/Campaign2.level
Map=28,50,24,30;40,36,12,14
Title=Forgotten Treasures
Briefing=A dungeon full of treasures has been reported. It is said that dragons took them from a powerful civilisation. Another keeper is trying to grab it.\n\nShow the rival keeper that he cannot stand your power.
Debriefing=The treasures are yours. The rival keeper will not threaten you again.

[Level]
File=campaign/Campaign3.level
Map=56,30,30,40;76,14,16,16
Title=Duel to Death
Briefing=A fool keeper is trying to get control of a dungeon you were staring at. Meanwhile, heroes are trying to steal the gold they can find.\n\nShow them who rules in the underworld.
Debriefing=Your rule over the underworld is unchallenged. The campaign is complete.
